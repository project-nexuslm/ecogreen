const T=[[\"verdict\",\"Verdict\"],[\"invest\",\"Investment\"],[\"fish\",\"Fish & pricing\"],[\"profit\",\"Profit model\"],[\"scrap\",\"Scrap pickup\"],[\"mkt\",\"Marketing\"],[\"legal\",\"Legal\"],[\"plan\",\"90-day plan\"]];\nlet tab=\"verdict\";\nconst E='<span class=\"est\">EST<\/span>',R='<span class=\"ok\">REF<\/span>';\nconst inr=n=>\"\u20b9\"+Math.round(n).toLocaleString(\"en-IN\");\n/* ---------- data ---------- */\nconst INV=[[\"Used 3-wheeler / small loader with insulated box body (or hire a pickup for Sundays first)\",110000],[\"2 insulated ice boxes (100 L) + display trays\",8000],[\"Digital scale, knives, chopping block, aprons, gloves\",10000],[\"Ice, crates, packaging, water tubs (first month)\",3000],[\"FSSAI, trade licence, Udyam, vehicle permit and fees\",4000],[\"Mini-kitchen: stove, kadai, tawa, utensils, commercial cylinder\",15000],[\"Banner, boards, phone, domain, WhatsApp Business setup\",8000],[\"Initial fish stock (first Sunday)\",15000],[\"Working capital (30 days of fuel, ice, wages)\",20000],[\"Contingency\",6000]];\nconst FISH=[[\"Mathi (sardine)\",120,\"Fast mover, low cost, best for evening fry\"],[\"Ayila (mackerel)\",250,\"Home-cook staple\"],[\"Nethili (anchovy)\",250,\"Fry / kuzhambu\"],[\"Freshwater rohu / catla\",170,\"Steady demand, low wastage\"],[\"Vilai\",350,\"Mid range\"],[\"Paarai (trevally)\",400,\"Sunday premium\"],[\"Prawns\",500,\"High margin, needs ice discipline\"],[\"Crab\",450,\"Order-based only\"],[\"Vanjiram (seer)\",800,\"Pre-order only, never stock blind\"]];\nconst SC={cons:{n:\"Conservative\",kg:15,mk:18,w:10,k:0},real:{n:\"Realistic\",kg:28,mk:25,w:7,k:2500},opt:{n:\"Optimistic\",kg:45,mk:30,w:5,k:4500}};\nlet G={cost:300,days:26,fuel:350,ice:150,misc:3000,fixed:2000,kmargin:35,kdays:20};\nconst SCRAP=[[\"Newspaper / office paper\",13],[\"Cardboard / cotton and carton boxes\",9],[\"PET plastic bottles\",18],[\"Hard plastic / containers\",16],[\"Glass bottles (per kg)\",3],[\"Tin / metal cans\",25]];\nlet reqs=[];try{reqs=JSON.parse(localStorage.getItem(\"gec_reqs\")||\"[]\")}catch(e){}\nlet owner=\"\";let cart={};\n/* ---------- helpers ---------- */\nfunction calc(s){const c=G.cost,gpk=(1-s.w/100)*(1+s.mk/100)*c-c,gross=s.kg*gpk*G.days,op=(G.fuel+G.ice)*G.days+G.misc+G.fixed,kit=s.k*(G.kmargin/100)*G.kdays,net=gross-op+kit;return{gpk,gross,op,kit,net,be:op/(G.days*gpk),rev:s.kg*(1-s.w/100)*c*(1+s.mk/100)*G.days}}\nfunction sc(k,f,v){SC[k][f]=+v;go(\"profit\")}function gv(f,v){G[f]=+v;go(\"profit\")}\n/* ---------- views ---------- */\nconst V={\nverdict(){const r=calc(SC.real),c=calc(SC.cons),tot=INV.reduce((a,b)=>a+b[1],0);return`\n<div class=\"alert bad\"><b>Do not buy a new refrigerated van with a \u20b92 lakh budget.<\/b> A new Tata Ace alone is listed from about \u20b93.99 lakh (Ace Pro / Ace Gold Petrol launch prices) up to \u20b96+ lakh for diesel, before the refrigeration body. ${R} Even second-hand reefer vans were seen listed at \u20b93.85 lakh and above. That is 2 to 3 times your budget, and the whole budget would go on the vehicle with nothing left for stock.<\/div>\n<div class=\"alert good\"><b>Viable if you start lean:<\/b> a used 3-wheeler or hired pickup with insulated ice boxes, Sunday-first selling, pre-orders on WhatsApp and the evening mini kitchen to convert unsold fish into higher-margin food. Buy the refrigerated van only after 3 profitable months, funded from profit or a vehicle loan.<\/div>\n<div class=\"grid\"><div class=\"kpi\"><b>${inr(tot)}<\/b><span>Lean phase-1 budget (${E})<\/span><\/div>\n<div class=\"kpi\"><b>${inr(c.net)}<\/b><span>Conservative monthly net<\/span><\/div>\n<div class=\"kpi\"><b class=\"pos\">${inr(r.net)}<\/b><span>Realistic monthly net<\/span><\/div>\n<div class=\"kpi\"><b>${r.be.toFixed(0)} kg/day<\/b><span>Break-even (realistic costs)<\/span><\/div><\/div>\n<div class=\"card\" style=\"margin-top:14px\"><h2>Why this combination works<\/h2><ul>\n<li><b>One vehicle, two businesses.<\/b> Tuesday to Saturday mornings: scrap pickups from offices and apartments. Sunday: fish. Evening: mini kitchen. The vehicle earns every day.<\/li>\n<li><b>Same customers.<\/b> Apartment associations and offices that give you scrap become your first fish customers, so marketing cost is shared.<\/li>\n<li><b>Wastage control.<\/b> Buy against pre-orders, sell the premium fish first, fry or curry whatever is left the same evening, and never freeze-and-resell as fresh.<\/li><\/ul><\/div>\n<div class=\"card\"><h2>Biggest risks<\/h2><ul><li>Fish is perishable: one bad buying day can wipe out a week of margin. Buy small, buy often.<\/li><li>Prices on this page are estimates. Check actual Ukkadam rates at 4 to 6 am for two weeks before spending money.<\/li><li>Fishing ban periods and monsoon push prices up and supply down.<\/li><li>Partnership: write down roles, capital split and profit share with your friend before you start.<\/li><\/ul><\/div>`},\ninvest(){const t=INV.reduce((a,b)=>a+b[1],0);return`<div class=\"card\"><h2>Phase 1: lean start (budget ${inr(200000)})<\/h2><div class=\"ov\"><table><tr><th>Item<\/th><th>Amount<\/th><\/tr>${INV.map(i=>`<tr><td>${i[0]} ${E}<\/td><td>${inr(i[1])}<\/td><\/tr>`).join(\"\")}<tr><td><b>Total<\/b><\/td><td><b>${inr(t)}<\/b><\/td><\/tr><\/table><\/div><\/div>\n<div class=\"card\"><h2>Phase 2: refrigerated van (after month 3)<\/h2><div class=\"ov\"><table><tr><th>Option<\/th><th>Price seen<\/th><\/tr><tr><td>New Tata Ace Pro / Gold Petrol (ex-showroom, no cooling) ${R}<\/td><td>from \u20b93.99 lakh<\/td><\/tr><tr><td>New Tata Ace Gold+ Diesel ${R}<\/td><td>from \u20b95.52 lakh<\/td><\/tr><tr><td>Used 2020 Bolero reefer van listing ${R}<\/td><td>\u20b93.85 lakh<\/td><\/tr><tr><td>Insulation / reefer body alone (listings vary widely) ${E}<\/td><td>\u20b91.5 to 3 lakh<\/td><\/tr><\/table><\/div><p class=\"sub\">Get written quotations from at least 3 sellers (Tata dealers in Coimbatore, body builders on Avinashi Road, and used-vehicle dealers) before committing. Prices above are listings, not confirmed quotes.<\/p><\/div>`},\nfish(){return`<div class=\"card\"><h2>Fish varieties and pricing<\/h2><p class=\"sub\">Wholesale figures are rough rates from local news and price sites, which disagree with each other and change daily. ${E} Retail = wholesale + 25% for door delivery (market retail is typically only about 10% above wholesale ${R}, so delivery convenience must justify the extra).<\/p>\n<div class=\"ov\"><table><tr><th>Fish<\/th><th>Wholesale/kg<\/th><th>Retail/kg<\/th><th>Note<\/th><th>Add<\/th><\/tr>${FISH.map((f,i)=>`<tr><td>${f[0]}<\/td><td>${inr(f[1])}<\/td><td>${inr(f[1]*1.25)}<\/td><td>${f[2]}<\/td><td><input type=\"number\" min=\"0\" step=\"0.5\" style=\"width:60px\" value=\"${cart[i]||\"\"}\" onchange=\"cart[${i}]=+this.value;tot()\"><\/td><\/tr>`).join(\"\")}<\/table><\/div>\n<div class=\"f2\" style=\"margin-top:12px\"><div><label>Customer name<\/label><input id=\"cn\"><\/div><div><label>Delivery area<\/label><input id=\"ca\" placeholder=\"e.g. Singanallur\"><\/div><div><label>Your WhatsApp number (10 digits)<\/label><input id=\"ow\" value=\"${owner}\" onchange=\"owner=this.value\"><\/div><\/div>\n<p id=\"ct\" class=\"sub\"><\/p><button class=\"btn\" onclick=\"ord()\">Send order on WhatsApp<\/button><\/div>\n<div class=\"card\"><h3>Sourcing plan<\/h3><ul><li><b>Ukkadam wholesale market:<\/b> go at 4 to 6 am, build one trusted agent, ask for daily rates in writing on WhatsApp.<\/li><li><b>Direct from fishermen:<\/b> Tamil Nadu coastal landing centres are far from Coimbatore, so use a bulk supplier or agent who ships by insulated transport. Test with one weekly consignment first.<\/li><li><b>Wastage targets:<\/b> 10% first month, under 6% by month 3. Track kg bought vs kg sold daily.<\/li><\/ul><\/div>`},\nprofit(){const keys=[\"cons\",\"real\",\"opt\"],o=keys.map(k=>calc(SC[k]));\nconst row=(l,f,u)=>`<tr><td>${l}<\/td>${keys.map(k=>`<td><input type=\"number\" value=\"${SC[k][f]}\" onchange=\"sc('${k}','${f}',this.value)\"><\/td>`).join(\"\")}<\/tr>`;\nconst out=(l,fn,b)=>`<tr><td>${b?\"<b>\"+l+\"<\/b>\":l}<\/td>${o.map(x=>`<td>${b?\"<b>\":\"\"}${fn(x)}${b?\"<\/b>\":\"\"}<\/td>`).join(\"\")}<\/tr>`;\nreturn`<div class=\"card\"><h2>Monthly profitability: three scenarios<\/h2><p class=\"sub\">All inputs are editable and are ${E}. Change them as you learn real numbers.<\/p>\n<div class=\"f2\"><div><label>Avg wholesale cost \u20b9/kg<\/label><input type=\"number\" value=\"${G.cost}\" onchange=\"gv('cost',this.value)\"><\/div><div><label>Working days / month<\/label><input type=\"number\" value=\"${G.days}\" onchange=\"gv('days',this.value)\"><\/div><div><label>Fuel per day \u20b9<\/label><input type=\"number\" value=\"${G.fuel}\" onchange=\"gv('fuel',this.value)\"><\/div><div><label>Ice per day \u20b9<\/label><input type=\"number\" value=\"${G.ice}\" onchange=\"gv('ice',this.value)\"><\/div><div><label>Packaging, phone, misc \u20b9/month<\/label><input type=\"number\" value=\"${G.misc}\" onchange=\"gv('misc',this.value)\"><\/div><div><label>Insurance, licences, repairs \u20b9/month<\/label><input type=\"number\" value=\"${G.fixed}\" onchange=\"gv('fixed',this.value)\"><\/div><div><label>Kitchen margin % (before gas and labour)<\/label><input type=\"number\" value=\"${G.kmargin}\" onchange=\"gv('kmargin',this.value)\"><\/div><div><label>Kitchen days / month<\/label><input type=\"number\" value=\"${G.kdays}\" onchange=\"gv('kdays',this.value)\"><\/div><\/div>\n<div class=\"ov\" style=\"margin-top:12px\"><table><tr><th><\/th>${keys.map(k=>`<th>${SC[k].n}<\/th>`).join(\"\")}<\/tr>\n${row(\"Fish bought and sold, kg/day\",\"kg\")}${row(\"Retail markup %\",\"mk\")}${row(\"Wastage %\",\"w\")}${row(\"Kitchen sales \u20b9/day\",\"k\")}\n${out(\"Fish revenue / month\",x=>inr(x.rev))}${out(\"Gross profit / month\",x=>inr(x.gross))}${out(\"Operating cost / month\",x=>inr(x.op))}${out(\"Kitchen profit / month\",x=>inr(x.kit))}\n${out(\"Net profit / month\",x=>`<span class=\"${x.net>=0?\"pos\":\"neg\"}\">${inr(x.net)}<\/span>`,1)}${out(\"Break-even kg/day\",x=>x.be.toFixed(1))}${out(\"Payback on \u20b92 lakh\",x=>x.net>0?(200000/x.net).toFixed(1)+\" months\":\"never\")}<\/table><\/div>\n<p class=\"sub\">Excludes your own salary, helper wages and vehicle loan EMI. If you hire a helper (about \u20b912,000 to \u20b915,000 ${E}), the conservative case loses money. That is why the plan starts owner-operated.<\/p><\/div>`},\nscrap(){return`<div class=\"card\"><h2>GreenEcoCity pickup request<\/h2><p class=\"sub\">Customers fill this in and you get a WhatsApp message. For real push notifications and a live admin console like your prototype, this form needs a small backend later.<\/p>\n<div class=\"f2\"><div><label>Name<\/label><input id=\"sn\"><\/div><div><label>Phone<\/label><input id=\"sp\"><\/div><div><label>Area / apartment<\/label><input id=\"sa\"><\/div><div><label>Items<\/label><select id=\"si\">${SCRAP.map(s=>`<option>${s[0]}<\/option>`).join(\"\")}<\/select><\/div><div><label>Approx kg<\/label><input id=\"sk\" type=\"number\" value=\"10\"><\/div><div><label>Your WhatsApp (10 digits)<\/label><input id=\"so\" value=\"${owner}\" onchange=\"owner=this.value\"><\/div><\/div>\n<p><button class=\"btn\" onclick=\"pick()\">Request pickup<\/button><\/p><\/div>\n<div class=\"grid\"><div class=\"card\"><h2>Buying rates ${E}<\/h2><div class=\"ov\"><table><tr><th>Item<\/th><th>\u20b9/kg<\/th><\/tr>${SCRAP.map(s=>`<tr><td>${s[0]}<\/td><td>${s[1]}<\/td><\/tr>`).join(\"\")}<\/table><\/div><p class=\"sub\">Verify with 2 or 3 Coimbatore scrap dealers. Your margin is the difference between what you pay households and what the dealer pays you.<\/p><\/div>\n<div class=\"card\"><h2>Pickup requests<\/h2><div id=\"rq\">${reqs.length?reqs.map(r=>`<p>\u2022 <b>${r.n}<\/b>, ${r.a}: ${r.i}, ${r.k} kg<\/p>`).join(\"\"):'<p class=\"sub\">None yet.<\/p>'}<\/div><\/div><\/div>\n<div class=\"card\"><h3>How to make money and win the market<\/h3><ul><li>Offer bulk contracts to offices and apartment associations: scheduled weekly pickup, weighed on a certified digital scale in front of them.<\/li><li>Give a monthly \"kg recycled\" certificate and a green-office badge. Companies like the ESG angle, and you can post it on social media.<\/li><li>Sort at source (paper, plastic, glass) so the dealer pays more per kg.<\/li><li>Do not collect e-waste, batteries or medical waste without a licence.<\/li><\/ul><\/div>`},\nmkt(){return`<div class=\"grid\"><div class=\"card\"><h2>Target areas<\/h2><ul><li>Start where you live and work: Singanallur, Ramanathapuram, Peelamedu.<\/li><li>Gated apartments in RS Puram, Saibaba Colony, Race Course, Saravanampatti. Meet the association secretary and ask for a weekly Sunday stop.<\/li><li>IT parks and offices for scrap contracts.<\/li><\/ul><\/div>\n<div class=\"card\"><h2>WhatsApp system<\/h2><ul><li>WhatsApp Business account with catalogue and a \"Sunday fish list\" posted every Saturday 6 pm.<\/li><li>Order cut-off Saturday 9 pm, delivery Sunday 7 to 11 am.<\/li><li>One broadcast list per apartment, plus a referral reward: free 250 g fish for each new family.<\/li><\/ul><\/div>\n<div class=\"card\"><h2>Social media<\/h2><ul><li>Reels: fish being cleaned, fresh catch at dawn, the mini kitchen sizzling, and scrap pickup with weighing.<\/li><li>Google Business Profile for both brands so people find you by search.<\/li><li>Brand line: \"Green city by day, fresh fish by evening.\"<\/li><\/ul><\/div><\/div>`},\nlegal(){return`<div class=\"alert warn\">Confirm every fee and rule with the office named below before paying. Rules change.<\/div><div class=\"card\"><div class=\"ov\"><table><tr><th>Requirement<\/th><th>Notes ${E}<\/th><\/tr>\n<tr><td>FSSAI registration<\/td><td>Required for selling fish and for the mini kitchen. Small food businesses below the turnover threshold use basic registration (very low annual fee). Apply at foscos.fssai.gov.in.<\/td><\/tr>\n<tr><td>Coimbatore City Municipal Corporation<\/td><td>Trade licence and permission for roadside or mobile selling spots. Ask the zonal office; stopping rules differ by ward.<\/td><\/tr>\n<tr><td>Vehicle<\/td><td>Commercial registration for a goods vehicle, valid insurance, fitness certificate. Using a private vehicle for business can void insurance.<\/td><\/tr>\n<tr><td>Udyam registration<\/td><td>Free, online, useful for bank loans and subsidies.<\/td><\/tr>\n<tr><td>Gas cylinder<\/td><td>Use a commercial cylinder for the kitchen, with a fire extinguisher on the vehicle.<\/td><\/tr>\n<tr><td>GST<\/td><td>Unprocessed fresh fish is generally exempt. Prepared food may differ; check with a CA if you cross the threshold.<\/td><\/tr>\n<tr><td>Scrap<\/td><td>Collecting household paper, plastic and glass is simple; hazardous or e-waste needs authorisation from the Tamil Nadu Pollution Control Board.<\/td><\/tr><\/table><\/div><\/div>`},\nplan(){const S=[[\"Days 1 to 15\",\"Validate before spending\",\"Visit Ukkadam at 5 am on 6 mornings, record prices and wastage-prone varieties. Talk to 30 households and 5 apartment associations. Get 3 vehicle quotes. Sign partnership terms with your friend.\"],[\"Days 16 to 30\",\"Licences and setup\",\"FSSAI, Udyam, corporation permission. Buy insulated boxes and scale. Build the WhatsApp catalogue. Launch the scrap pickup page and collect your first 10 requests.\"],[\"Days 31 to 45\",\"Pilot\",\"Two Sundays with pre-orders only, 15 to 20 kg each. Evening kitchen on the same day to use leftovers. Track every kg.\"],[\"Days 46 to 60\",\"Repeat customers\",\"Add Wednesday and Saturday short routes. Start apartment weekly stops. Referral rewards.\"],[\"Days 61 to 90\",\"Review and decide\",\"If realistic net is above \u20b925,000 per month for 4 weeks, plan the refrigerated van through a loan or savings. Otherwise fix wastage and pricing first.\"]];return S.map((s,i)=>`<div class=\"card step\"><i>${i+1}<\/i><div><b>${s[0]}: ${s[1]}<\/b><br>${s[2]}<\/div><\/div>`).join(\"\")+`<div class=\"card\"><h2>Expansion<\/h2><ul><li>Month 4 to 6: refrigerated van, second Sunday route, restaurant supply of cleaned fish.<\/li><li>Month 6 to 12: permanent mini kitchen or stall, cut-and-clean service, ready-to-cook marinated packs.<\/li><li>Scrap: corporate contracts, a small sorting yard, and an app like your GreenEcoCity prototype.<\/li><\/ul><\/div>`}};\n/* ---------- actions ---------- */\nfunction tot(){let t=0,c=0;for(const i in cart){if(cart[i]>0){t+=cart[i]*FISH[i][1]*1.25;c+=cart[i]}}document.getElementById(\"ct\").textContent=c?`${c} kg selected: about ${inr(t)} (estimate)`:\"\"}\nfunction ord(){const l=Object.keys(cart).filter(i=>cart[i]>0).map(i=>`${FISH[i][0]} ${cart[i]} kg`);if(!l.length)return alert(\"Add at least one fish.\");const m=`Fish order\\nName: ${document.getElementById(\"cn\").value}\\nArea: ${document.getElementById(\"ca\").value}\\n${l.join(\"\\n\")}`;if(!/^\\d{10}$/.test(owner))return alert(\"Enter your 10 digit WhatsApp number.\");window.open(\"https://wa.me/91\"+owner+\"?text=\"+encodeURIComponent(m),\"_blank\")}\nfunction pick(){const g=i=>document.getElementById(i).value;const r={n:g(\"sn\"),p:g(\"sp\"),a:g(\"sa\"),i:g(\"si\"),k:g(\"sk\")};if(!r.n||!r.a)return alert(\"Enter name and area.\");reqs.push(r);try{localStorage.setItem(\"gec_reqs\",JSON.stringify(reqs))}catch(e){}owner=g(\"so\");go(\"scrap\");if(/^\\d{10}$/.test(owner))window.open(\"https://wa.me/91\"+owner+\"?text=\"+encodeURIComponent(`Scrap pickup\\n${r.n} (${r.p})\\n${r.a}\\n${r.i}: ${r.k} kg`),\"_blank\")}\nfunction go(t){tab=t;document.getElementById(\"tabs\").innerHTML=T.map(x=>`<button class=\"${x[0]==tab?\"on\":\"\"}\" onclick=\"go('${x[0]}')\">${x[1]}<\/button>`).join(\"\");document.getElementById(\"v\").innerHTML=V[t]()}\ngo(\"verdict\");\n<\/script><\/body><\/html>\n",app:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>GreenEcoCity \u2014 App Prototype<\/title>\n<style>\n  :root{\n    --bg:#f4f6f3; --surface:#ffffff; --border:#e9ede7; --text:#0a0a0a; --text-dim:#3f3f46; --muted:#71717a; --muted2:#a1a1aa;\n    --green:#16a34a; --green-light:#dcfce7; --green-dark:#15803d; --lime:#84cc16; --amber:#d97706;\n    --dark:#0a0a0a; --dark-surface:#18181b;\n    --a-bg:#f5f5f5; --a-surface:#ffffff; --a-border:#e5e5e5; --a-text:#171717; --a-muted:#737373;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#e5e5e5;color:var(--text);}\n  .svg-icon{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;}\n  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}\n  input,select{font-family:inherit;}\n  .page{max-width:1150px;margin:0 auto;padding:28px 16px 60px;}\n  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}\n  .brand-name{font-weight:800;font-size:20px;color:#171717;}\n  .brand-tag{color:#737373;font-size:13px;margin-top:2px;}\n  .toggle{display:inline-flex;background:#d4d4d4;border-radius:999px;padding:4px;}\n  .toggle button{padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;color:#525252;}\n  .toggle button.active{background:#171717;color:#fff;}\n\n  /* Phone frame */\n  .phone-wrap{display:flex;justify-content:center;padding:20px 0;}\n  .phone{width:380px;height:800px;background:var(--bg);border:6px solid #1f1f1f;border-radius:44px;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);}\n  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:24px;background:#1f1f1f;border-radius:0 0 16px 16px;z-index:20;}\n  .phone-inner{height:100%;display:flex;flex-direction:column;}\n  .status-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 4px;font-size:12px;color:#111;}\n  .status-bar .icons{display:flex;gap:6px;align-items:center;}\n  .screen{flex:1;overflow-y:auto;padding:0 16px;position:relative;}\n  .screen::-webkit-scrollbar{display:none;}\n  .navbar{display:flex;border-top:1px solid var(--border);background:#fff;}\n  .navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;color:#a1a1aa;}\n  .navbar button.active{color:var(--green);}\n  .navbar span{font-size:9px;font-weight:700;}\n\n  .row{display:flex;align-items:center;}\n  .between{justify-content:space-between;}\n  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}\n  .muted{color:var(--muted);}\n  .amber{color:var(--amber);}\n  .green{color:var(--green);}\n  .mono{font-family:'SF Mono',Consolas,Menlo,monospace;}\n\n  .eta-banner{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}\n  .loc-pill{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#111;background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 10px;}\n\n  .scale{background:var(--dark-surface);border:1px solid #27272a;border-radius:16px;padding:14px;}\n  .scale-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}\n  .scale-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa;}\n  .live-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:5px;}\n  .scale-vals{display:flex;justify-content:space-between;align-items:flex-end;}\n  .scale-num{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:23px;letter-spacing:.02em;}\n\n  .cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}\n  .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}\n  .cat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}\n\n  .btn-primary{width:100%;background:var(--green);color:#fff;font-weight:800;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;box-shadow:0 6px 14px rgba(22,163,74,.3);}\n  .btn-primary:disabled{background:#d4d4d8;color:#a1a1aa;box-shadow:none;}\n  .btn-outline{border:1.5px solid var(--green);color:var(--green);font-weight:700;border-radius:14px;padding:10px 14px;font-size:13px;}\n  .btn-danger-text{color:#dc2626;font-weight:700;font-size:12.5px;}\n\n  .stepper-row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:11px;display:flex;align-items:center;gap:11px;margin-bottom:9px;}\n  .stepper-row.active{border-color:var(--green);background:var(--green-light);}\n  .qty-btn{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;}\n  .qty-minus{background:#f4f4f5;color:#3f3f46;}\n  .qty-plus{background:var(--green);color:#fff;}\n\n  .chip{border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;}\n  .chip-off{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);}\n  .chip-on{background:var(--green);color:#fff;}\n\n  .cart-bar{position:sticky;bottom:0;left:0;right:0;background:var(--dark);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin:10px 0;box-shadow:0 8px 20px rgba(0,0,0,.25);}\n\n  .pill-status{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-block;white-space:nowrap;}\n  .st-Requested{background:#fef3c7;color:#92400e;}\n  .st-Accepted{background:#e0e7ff;color:#3730a3;}\n  .st-AgentAssigned{background:#e0f2fe;color:#075985;}\n  .st-OutforPickup{background:#dbeafe;color:#1d4ed8;}\n  .st-Weighing{background:#ede9fe;color:#5b21b6;}\n  .st-P t inr = (n)=> '\\u20b9'+Math.round(n).toLocaleString('en-IN');\n\n/* ---- Date helpers (ISO internal) ---- */\nconst TODAY = new Date();\nfunction daysAgo(n){ const d=new Date(TODAY); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }\nfunction fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'-'+m+'-'+y; }\n\n/* ---- Accounts ---- */\nconst CUSTOMERS = ['Arun Kumar','Suresh Foundry','Green Meadows Apts','TechPark Office','Priya R.','Anand K.'];\nconst RIDERS = [\n  { name:'Murugan', rating:4.8, phone:'+91 98xxx xx011', zone:'Central Coimbatore' },\n  { name:'Devi',    rating:4.9, phone:'+91 98xxx xx022', zone:'RS Puram \\u2013 Saibaba' },\n  { name:'Kumar',   rating:4.7, phone:'+91 98xxx xx033', zone:'Peelamedu \\u2013 Vadavalli' },\n];\n\n/* ---- Seeded pseudo-random business ledger (last 12 months) ---- */\nfunction mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nconst BUSINESS_LEDGER = (function(){\n  const rnd = mulberry32(20260727);\n  const rows = [];\n  const cats = [['Scrap Metal',32],['E-Waste',18],['Paper & Cardboard',9],['Plastic',12],['Household Mixed',6]];\n  CUSTOMERS.forEach((cust, ci)=>{\n    const freq = 10 + Math.floor(rnd()*22);          // transactions across the year\n    for(let i=0;i<freq;i++){\n      const day = 1 + Math.floor(rnd()*360);\n      const [ , rate] = cats[Math.floor(rnd()*cats.length)];\n      const kg = 8 + Math.round(rnd()* (ci<3?260:60));  // businesses move more volume\n      rows.push({ customer:cust, date:daysAgo(day), weight:kg, amount:Math.round(kg*rate) });\n    }\n  });\n  return rows;\n})();\n\nfunction orderTotals(o){\n  if(o.status==='Paid' && o.finalWeight!=null) return { weight:o.finalWeight, amount:o.finalAmount };\n  const weight = o.items.reduce((s,it)=>s+it.qty,0);\n  const amount = o.items.reduce((s,it)=>s+it.qty*it.rate,0);\n  return { weight, amount };\n}\n\n/* ---------------------------------------------------------------------- */\n/* Seed orders \\u2014 single shared source of truth for customer + admin    */\n/* ---------------------------------------------------------------------- */\nlet seq = 1050;\nconst SEED_ORDERS = [\n  { id:'GEC-1049', customerName:'Suresh Foundry', area:'Kurichi', addressDetail:'Kurichi Industrial Estate, Coimbatore', slot:'Today, 2\\u20134 PM', payMethod:'upi', items:[{name:'Scrap Metal',qty:120,rate:32}], status:'Out for Pickup', agent:'Murugan', source:'manual', date:daysAgo(0) },\n  { id:'GEC-1048', customerName:'Green Meadows Apts', area:'Saibaba Colony', addressDetail:'Green Meadows Apartments, Saibaba Colony', slot:'Today, 3\\u20135 PM', payMethod:'cash', items:[{name:'Paper & Cardboard',qty:30,rate:9},{name:'Plastic',qty:20,rate:12},{name:'Household Mixed',qty:14,rate:6}], status:'Weighing', agent:'Devi', source:'manual', date:daysAgo(0) },\n  { id:'GEC-1047', customerName:'Anand K.', area:'Peelamedu', addressDetail:'Peelamedu, Coimbatore', slot:'Yesterday', payMethod:'upi', items:[{name:'E-Waste',qty:5,rate:18}], status:'Paid', agent:'Murugan', source:'manual', finalWeight:5, finalAmount:90, date:daysAgo(1) },\n  { id:'GEC-1046', customerName:'TechPark Office', area:'Vadavalli', addressDetail:'TechPark, Vadavalli', slot:'Yesterday', payMethod:'upi', items:[{name:'E-Waste',qty:20,rate:18},{name:'Scrap Metal',qty:20,rate:32}], status:'Paid', agent:'Devi', source:'manual', finalWeight:40, finalAmount:1000, date:daysAgo(1) },\n  { id:'GEC-1045', customerName:'Priya R.', area:'RS Puram', addressDetail:'RS Puram, Coimbatore', slot:'Today, 5\\u20137 PM', payMethod:'cash', items:[{name:'Scrap Metal',qty:12,rate:32},{name:'Plastic',qty:6,rate:12}], status:'Requested', agent:null, source:'manual', date:daysAgo(0) },\n  { id:'GEC-1044', customerName:'Arun Kumar', area:'Home', addressDetail:'12, Race Course Road, Coimbatore', slot:'Today, 4\\u20136 PM', payMethod:'upi', items:[{name:'Scrap Metal',qty:18,rate:32},{name:'Paper & Cardboard',qty:10,rate:9}], status:'Agent Assigned', agent:'Kumar', source:'customer', date:daysAgo(0) },\n  { id:'GEC-1042', customerName:'Arun Kumar', area:'Home', addressDetail:'12, Race Course Road, Coimbatore', slot:'Last week', payMethod:'upi', items:[{name:'E-Waste',qty:8,rate:18}], status:'Paid', agent:'Kumar', source:'customer', finalWeight:8, finalAmount:144, date:daysAgo(6) },\n  { id:'GEC-1039', customerName:'Arun Kumar', area:'Office', addressDetail:'TIDEL Park, Coimbatore', slot:'This month', payMethod:'cash', items:[{name:'Plastic',qty:14,rate:12},{name:'Household Mixed',qty:9,rate:6}], status:'Paid', agent:'Devi', source:'customer', finalWeight:23, finalAmount:222, date:daysAgo(20) },\n];\n\n/* ---------------------------------------------------------------------- */\n/* ERP data \\u2014 Purchase (from customers) \\u2192 Inventory \\u2192 Sales (to buyers) */\n/* ---------------------------------------------------------------------- */\nconst SALE_RATE = { 'Scrap Metal':42, 'E-Waste':26, 'Paper & Cardboard':13, 'Plastic':17, 'Household Mixed':9, 'Construction Debris':5 };\nconst BUYERS = [\n  { id:'buy1', name:'Coimbatore Steel Re-rollers', categories:['Scrap Metal'] },\n  { id:'buy2', name:'GreenCycle Recyclers Pvt Ltd', categories:['E-Waste','Plastic'] },\n  { id:'buy3', name:'Kovai Paper Mills', categories:['Paper & Cardboard'] },\n  { id:'buy4', name:'Metro Foundry Works', categories:['Scrap Metal','Construction Debris'] },\n  { id:'buy5', name:'EcoTerra Composting Unit', categories:['Household Mixed'] },\n];\nconst OPENING_STOCK = { 'Scrap Metal':400, 'E-Waste':60, 'Paper & Cardboard':120, 'Plastic':90, 'Household Mixed':50, 'Construction Debris':80 };\nlet saleSeq = 500;\nconst SEED_SALES = [\n  { id:'SO-501', buyer:'Coimbatore Steel Re-rollers', category:'Scrap Metal', qty:180, rate:42, amount:7560, date:daysAgo(8) },\n  { id:'SO-502', buyer:'GreenCycle Recyclers Pvt Ltd', category:'E-Waste', qty:20, rate:26, amount:520, date:daysAgo(15) },\n  { id:'SO-503', buyer:'Kovai Paper Mills', category:'Paper & Cardboard', qty:35, rate:13, amount:455, date:daysAgo(4) },\n  { id:'SO-504', buyer:'Metro Foundry Works', category:'Scrap Metal', qty:150, rate:41, amount:6150, date:daysAgo(200) },\n  { id:'SO-505', buyer:'GreenCycle Recyclers Pvt Ltd', category:'Plastic', qty:25, rate:17, amount:425, date:daysAgo(25) },\n];\n\n/* ---------------------------------------------------------------------- */\n/* State                                                                  */\n/* ---------------------------------------------------------------------- */\nconst STATE = {\n  auth:null, loginRole:null,\n  mode:'customer', tab:'home', step:1, cart:{}, address:'home', slot:null, payMethod:'upi',\n  orders: SEED_ORDERS, expanded:null, adminFilter:'All', editDraft:null, showManualForm:false,\n  riderTab:'jobs', bizPeriod:'week', erpTab:'ops', sales: SEED_SALES, ledgerPeriod:'all',\n};\n\n/* ---- Auth actions ---- */\nfunction chooseRole(r){ STATE.loginRole = STATE.loginRole===r ? null : r; render(); }\nfunction loginAs(role, name){\n  STATE.auth = { role, name: name||null, customer: role==='customer' ? name : null };\n  STATE.mode = role;\n  STATE.tab = 'home'; STATE.riderTab='jobs'; STATE.step=1; STATE.cart={}; STATE.expanded=null;\n  render();\n}\nfunction logout(){ STATE.auth=null; STATE.loginRole=null; STATE.editDraft=null; render(); }\n\n/* ---------------------------------------------------------------------- */\n/* Customer actions                                                       */\n/* ---------------------------------------------------------------------- */\nfunction setMode(m){ STATE.mode=m; render(); }\nfunction setTab(t){ STATE.tab=t; render(); }\nfunction setStep(s){ STATE.step=s; render(); }\nfunction addToCartFromHome(id){ STATE.cart[id]=(STATE.cart[id]||0)+1; STATE.step=1; STATE.tab='schedule'; render(); }\nfunction changeQty(id, delta){\n  const cur = STATE.cart[id]||0;\n  STATE.cart[id] = Math.max(0, Math.round((cur+delta)*10)/10);\n  render();\n}\nfunction setAddress(id){ STATE.address=id; render(); }\nfunction setSlot(s){ STATE.slot=s; render(); }\nfunction setPayMethod(m){ STATE.payMethod=m; render(); }\n\nfunction confirmBooking(){\n  const items = CATEGORIES.filter(c => (STATE.cart[c.id]||0) > 0).map(c => ({ name:c.name, qty:STATE.cart[c.id], rate:c.rate }));\n  const addr = ADDRESSES.find(a=>a.id===STATE.address);\n  seq += 1;\n  const order = {\n    id:'GEC-'+seq, customerName: STATE.auth.customer, area:addr.label, addressDetail:addr.detail,\n    slot: STATE.slot, payMethod: STATE.payMethod, items, status:'Requested', agent:null, source:'customer', date:daysAgo(0),\n  };\n  STATE.orders = [order, ...STATE.orders];\n  STATE.cart = {}; STATE.slot = null; STATE.tab = 'track';\n  render();\n}\n\nfunction myOrders(){\n  const c = STATE.auth ? STATE.auth.customer : null;\n  return STATE.orders.filter(o => o.customerName===c);\n}\nfunction myActiveOrder(){\n  return myOrders().find(o => o.status!=='Paid' && o.status!=='Cancelled');\n}\nfunction myHistory(){\n  return myOrders().filter(o => o.status==='Paid').sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n}\nfunction toggleExpand(id){ STATE.expanded = STATE.expanded===id ? null : id; render(); }\n\n/* ---------------------------------------------------------------------- */\n/* Admin (shared) order-control actions \\u2014 these also drive the customer  */\n/* app's Track screen since both read from the same STATE.orders list.    */\n/* ---------------------------------------------------------------------- */\nfunction findOrder(id){ return STATE.orders.find(o=>o.id===id); }\n\nfunction acceptOrder(id){ findOrder(id).status='Accepted'; render(); }\nfunction assignAgent(id, agent){\n  if(!agent) return;\n  const o = findOrder(id); o.agent = agent; o.status = 'Agent Assigned'; render();\n}\nfunction markOutForPickup(id){ findOrder(id).status='Out for Pickup'; render(); }\nfunction startWeighing(id){\n  const o = findOrder(id);\n  o.status='Weighing';\n  STATE.editDraft = { orderId:id, items: o.items.map(it=>({...it})) };\n  render();\n}\nfunction updateDraftQty(idx, value){\n  const v = parseFloat(value);\n  STATE.editDraft.items[idx].qty = isNaN(v) ? 0 : Math.max(0, v);\n  render();\n}\nfunction releasePayment(id){\n  const o = findOrder(id);\n  const draft = STATE.editDraft && STATE.editDraft.orderId===id ? STATE.editDraft.items : o.items;\n  o.items = draft;\n  o.finalWeight = Math.round(draft.reduce((s,it)=>s+it.qty,0)*10)/10;\n  o.finalAmount = Math.round(draft.reduce((s,it)=>s+it.qty*it.rate,0));\n  o.status = 'Paid';\n  STATE.editDraft = null;\n  render();\n}\nfunction cancelOrder(id){\n  const o = findOrder(id); o.status='Cancelled'; STATE.editDraft=null; render();\n}\nfunction setAdminFilter(f){ STATE.adminFilter=f; render(); }\nfunction toggleManualForm(){ STATE.showManualForm = !STATE.showManualForm; render(); }\nfunction addManualOrder(){\n  const name = document.getElementById('mf-name').value.trim() || 'Walk-in Customer';\n  const area = document.getElementById('mf-area').value.trim() || 'Coimbatore';\n  const catName = document.getElementById('mf-cat').value;\n  const qty = parseFloat(document.getElementById('mf-qty').value) || 1;\n  const cat = CATEGORIES.find(c=>c.name===catName);\n  seq += 1;\n  const order = {\n    id:'GEC-'+seq, customerName:name, area, addressDetail:area+', Coimbatore', slot:'Walk-in',\n    payMethod:'cash', items:[{name:cat.name, qty, rate:cat.rate}], status:'Requested', agent:null, source:'manual',\n  };\n  STATE.orders = [order, ...STATE.orders];\n  STATE.showManualForm = false;\n  render();\n}\n\n/* ---------------------------------------------------------------------- */\n/* Shared UI bits                                                         */\n/* ---------------------------------------------------------------------- */\nfunction scaleReadout(weight, amount, label){\n  return `<div class=\"scale\">\n    <div class=\"scale-top\">\n      <span class=\"scale-label\">${label||'Digital Scale'}<\/span>\n      <span style=\"font-size:10px;color:#4ade80;display:flex;align-items:center;\"><span class=\"live-dot\"><\/span>Live<\/span>\n    <\/div>\n    <div class=\"scale-vals\">\n      <div><div class=\"scale-label\" style=\"margin-bottom:3px;\">WEIGHT<\/div><div class=\"scale-num\" style=\"color:#4ade80;\">${weight.toFixed(1)}<span style=\"font-size:13px;\">kg<\/span><\/div><\/div>\n      <div style=\"text-align:right;\"><div class=\"scale-label\" style=\"margin-bottom:3px;\">EST. AMOUNT<\/div><div class=\"scale-num\" style=\"color:#fbbf24;\">${inr(amount)}<\/div><\/div>\n    <\/div>\n  <\/div>`;\n}\nfunction statusPill(status){\n  return `<span class=\"pill-status st-${STATUS_KEY(status)}\">${status}<\/span>`;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Customer screens                                                       */\n/* ---------------------------------------------------------------------- */\nfunction homeScreen(){\n  return `\n  <div class=\"row between\" style=\"padding-top:14px;padding-bottom:12px;\">\n    <div>\n      <div style=\"font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;\">${icon('recycle',18,'green')} GreenEcoCity<\/div>\n      <button class=\"loc-pill\" style=\"margin-top:6px;\" onclick=\"setTab('schedule')\">${icon('mappin',11)} Home \\u2013 Race Course Road ${icon('chevrondown',11)}<\/button>\n    <\/div>\n    <button style=\"width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#3f3f46;\">${icon('bell',16)}<\/button>\n  <\/div>\n\n  <button class=\"eta-banner\" style=\"width:100%;text-align:left;\" onclick=\"setTab('schedule')\">\n    <span style=\"display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;\">${icon('zap',16)} Next pickup slot: Today, 4\\u20136 PM<\/span>\n    ${icon('chevronright',16)}\n  <\/button>\n\n  <div class=\"card\" style=\"padding:12px;margin-bottom:16px;\">\n    <div class=\"scale-label\" style=\"margin-bottom:8px;color:#71717a;\">Today's Coimbatore Rates<\/div>\n    <div style=\"display:flex;gap:8px;overflow-x:auto;\">\n      ${LIVE_RATES.map(r=>`<div style=\"flex-shrink:0;background:#f4f4f5;border-radius:12px;padding:8px 10px;text-align:center;min-width:82px;\">\n        <div class=\"muted\" style=\"font-size:10px;\">${r.label}<\/div>\n        <div class=\"green mono\" style=\"font-size:13px;font-weight:700;\">${r.value}<\/div>\n      <\/div>`).join('')}\n    <\/div>\n  <\/div>\n\n  <div style=\"font-weight:700;font-size:14px;margin-bottom:10px;\">What are you selling today?<\/div>\n  <div class=\"cat-grid\">\n    ${CATEGORIES.map(c=>`<button class=\"cat-card\" onclick=\"addToCartFromHome('${c.id}')\">\n      <div class=\"cat-icon\" style=\"background:${c.bg};color:${c.fg};\">${icon(c.icon,17)}<\/div>\n      <div style=\"font-size:11.5px;font-weight:700;line-height:1.2;\">${c.name}<\/div>\n      <div class=\"amber mono\" style=\"font-size:11px;font-weight:800;margin-top:3px;\">${inr(c.rate)}/kg<\/div>\n    <\/button>`).join('')}\n  <\/div>\n\n  <button class=\"btn-primary\" style=\"margin-bottom:16px;\" onclick=\"setTab('schedule')\">${icon('calendar',18)} Schedule a Pickup<\/button>\n  `;\n}\n\nfunction scheduleScreen(){\n  const items = CATEGORIES.map(c=>({...c, qty: STATE.cart[c.id]||0}));\n  const totalWeight = items.reduce((s,it)=>s+it.qty,0);\n  const totalAmount = items.reduce((s,it)=>s+it.qty*it.rate,0);\n\n  if(STATE.step===1){\n    return `\n    <div style=\"padding-top:14px;padding-bottom:10px;\">\n      <div style=\"font-weight:800;font-size:18px;\">Select your waste<\/div>\n      <div class=\"muted\" style=\"font-size:12px;margin-top:2px;\">Tap + to add an approximate weight for each type<\/div>\n    <\/div>\n    ${items.map(c=>`<div class=\"stepper-row ${c.qty>0?'active':''}\">\n        <div class=\"cat-icon\" style=\"background:${c.bg};color:${c.fg};flex-shrink:0;width:38px;height:38px;\">${icon(c.icon,16)}<\/div>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:13.5px;font-weight:700;\">${c.name}<\/div>\n          <div class=\"amber mono\" style=\"font-size:11.5px;\">${inr(c.rate)}/kg<\/div>\n        <\/div>\n        <button class=\"qty-btn qty-minus\" onclick=\"changeQty('${c.id}',-1)\">${icon('minus',13)}<\/button>\n        <span class=\"mono\" style=\"width:36px;text-align:center;font-size:13px;\">${c.qty.toFixed(1)}<\/span>\n        <button class=\"qty-btn qty-plus\" onclick=\"changeQty('${c.id}',1)\">${icon('plus',13)}<\/button>\n      <\/div>`).join('')}\n    <div class=\"cart-bar\">\n      <div>\n        <div style=\"color:#4ade80;font-size:11px;font-weight:700;\">${totalWeight.toFixed(1)} kg selected<\/div>\n        <div style=\"color:#fbbf24;font-weight:800;font-size:15px;\">${inr(totalAmount)}<\/div>\n      <\/div>\n      <button class=\"btn-primary\" style=\"width:auto;padding:10px 18px;box-shadow:none;\" ${totalWeight===0?'disabled':''} onclick=\"setStep(2)\">Continue ${icon('chevronright',15)}<\/button>\n    <\/div>\n    `;\n  }\n\n  return `\n  <button onclick=\"setStep(1)\" style=\"display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;padding:14px 0 10px;\">${icon('chevronleft',14)} Back<\/button>\n  <div style=\"font-weight:800;font-size:18px;margin-bottom:14px;\">Pickup details<\/div>\n\n  <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;\">PICKUP ADDRESS<\/div>\n  ${ADDRESSES.map(a=>`<button onclick=\"setAddress('${a.id}')\" class=\"card\" style=\"width:100%;text-align:left;padding:12px;display:flex;gap:10px;margin-bottom:8px;${STATE.address===a.id?'border-color:var(--green);background:var(--green-light);':''}\">\n    <span style=\"margin-top:2px;color:${STATE.address===a.id?'var(--green)':'#a1a1aa'};\">${icon('mappin',15)}<\/span>\n    <div><div style=\"font-size:13.5px;font-weight:700;\">${a.label}<\/div><div class=\"muted\" style=\"font-size:11px;\">${a.detail}<\/div><\/div>\n  <\/button>`).join('')}\n\n  <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 8px;\">PICKUP SLOT<\/div>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;\">\n    ${SLOTS.map(s=>`<button onclick=\"setSlot('${s}')\" class=\"chip ${STATE.slot===s?'chip-on':'chip-off'}\">${icon('clock',12)} ${s}<\/button>`).join('')}\n  <\/div>\n\n  <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;\">GET PAID VIA<\/div>\n  <div style=\"display:flex;gap:8px;margin-bottom:10px;\">\n    <button onclick=\"setPayMethod('upi')\" class=\"chip ${STATE.payMethod==='upi'?'chip-on':'chip-off'}\" style=\"flex:1;text-align:center;\">UPI<\/button>\n    <button onclick=\"setPayMethod('cash')\" class=\"chip ${STATE.payMethod==='cash'?'chip-on':'chip-off'}\" style=\"flex:1;text-align:center;\">Cash<\/button>\n  <\/div>\n\n  <div class=\"cart-bar\">\n    ${scaleReadout(totalWeight,totalAmount,'Order Summary')}\n  <\/div>\n  <button class=\"btn-primary\" style=\"margin:10px 0 16px;\" ${!STATE.slot?'disabled':''} onclick=\"confirmBooking()\">Confirm Pickup<\/button>\n  `;\n}\n\nfunction trackScreen(){\n  const o = myActiveOrder() || myHistory()[0];\n  if(!o){\n    return `<div style=\"text-align:center;padding-top:90px;\">\n      ${icon('truck',34,'muted')}\n      <div style=\"font-weight:700;color:#27272a;margin:10px 0 4px;\">No active pickup<\/div>\n      <div class=\"muted\" style=\"font-size:12px;margin-bottom:18px;\">Schedule one from Home to track it here<\/div>\n      <button class=\"chip chip-on\" onclick=\"setTab('schedule')\" style=\"padding:10px 20px;\">Schedule a Pickup<\/button>\n    <\/div>`;\n  }\n  const { weight, amount } = orderTotals(o);\n  const idx = STATUSES.indexOf(o.status);\n  const isPaid = o.status==='Paid';\n\n  return `\n  <div style=\"font-weight:800;font-size:18px;padding-top:14px;margin-bottom:12px;\">${isPaid?'Pickup complete':'Track pickup'}<\/div>\n\n  ${isPaid ? `<div class=\"card\" style=\"padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#16a34a,#15803d);border:none;color:#fff;\">\n    <div style=\"display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;\">${icon('checkcircle',18)} Payment credited<\/div>\n    <div style=\"font-size:12px;color:#dcfce7;margin-top:4px;\">${inr(amount)} for ${weight} kg \\u00b7 paid via ${o.payMethod==='upi'?'UPI':'Cash'} \\u00b7 ${fmtDate(o.date)}<\/div>\n  <\/div>` : ''}\n\n  <div class=\"card\" style=\"padding:14px;margin-bottom:14px;\">\n    <div class=\"row between\" style=\"margin-bottom:10px;\">\n      <span class=\"muted mono\" style=\"font-size:11px;\">${o.id}<\/span>\n      ${statusPill(o.status)}\n    <\/div>\n    <div style=\"font-size:13.5px;margin-bottom:4px;\">${o.items.map(c=>c.name).join(', ')}<\/div>\n    <div class=\"muted\" style=\"font-size:11px;margin-bottom:12px;\">${o.addressDetail} \\u00b7 ${o.slot}<\/div>\n    ${scaleReadout(weight, amount, isPaid?'Final weighed total':'Digital Scale')}\n  <\/div>\n\n  <div class=\"card\" style=\"padding:12px 14px;margin-bottom:14px;background:#f4f4f5;border:none;\">\n    <div style=\"font-size:12.5px;color:#3f3f46;\">${o.agent ? o.agent+' ' : 'A '}${ETA_TEXT[o.status]}<\/div>\n  <\/div>\n\n  ${o.agent && o.status!=='Cancelled' ? `<div class=\"card\" style=\"padding:10px;margin-bottom:14px;display:flex;align-items:center;gap:10px;\">\n    <div style=\"width:38px;height:38px;border-radius:50%;background:#f4f4f5;display:flex;align-items:center;justify-content:center;font-weight:800;\">${o.agent[0]}<\/div>\n    <div><div style=\"font-size:13.5px;font-weight:700;\">${o.agent}<\/div>\n    <div class=\"amber\" style=\"font-size:11px;display:flex;align-items:center;gap:4px;\">${icon('star',11)} 4.8 \\u00b7 <span class=\"green\">${icon('shield',11)}<\/span> Verified<\/div><\/div>\n  <\/div>` : ''}\n\n  ${o.status==='Cancelled' ? `<div class=\"card\" style=\"padding:16px;text-align:center;\">${icon('xcircle',26,'')}<div style=\"font-weight:700;margin-top:6px;color:#991b1b;\">Pickup cancelled<\/div><\/div>` : `\n  <div class=\"card\" style=\"padding:14px;margin-bottom:14px;\">\n    ${STATUSES.map((label,i)=>`<div class=\"timeline-item\">\n      <div class=\"timeline-dot-col\">\n        <span style=\"color:${i<=idx?'var(--green)':'#d4d4d8'};\">${icon(i<=idx?'checkcircle':'circle',18)}<\/span>\n        ${i<STATUSES.length-1?`<div class=\"timeline-line\" style=\"background:${i<idx?'var(--green)':'#e4e4e7'};\"><\/div>`:''}\n      <\/div>\n      <div style=\"padding-bottom:16px;\">\n        <div style=\"font-size:13px;font-weight:600;color:${i<=idx?'#18181b':'#a1a1aa'};\">${label}<\/div>\n        ${i===idx ? `<div class=\"green\" style=\"font-size:11px;\">In progress\\u2026<\/div>` : ''}\n      <\/div>\n    <\/div>`).join('')}\n  <\/div>`}\n\n  ${(o.status!=='Out for Pickup' && o.status!=='Weighing' && o.status!=='Paid' && o.status!=='Cancelled') ? `<button class=\"btn-danger-text\" style=\"padding:6px 0 16px;\" onclick=\"cancelOrder('${o.id}')\">Cancel this pickup<\/button>` : ''}\n  <div class=\"tip\" style=\"margin-bottom:14px;\">This status is updated live by your GreenEcoCity pickup partner.<\/div>\n  `;\n}\n\nfunction walletScreen(){\n  const hist = myHistory();\n  const totalEarned = hist.reduce((s,o)=>s+orderTotals(o).amount,0);\n  const totalKg = Math.round(hist.reduce((s,o)=>s+orderTotals(o).weight,0)*10)/10;\n  return `\n  <div style=\"font-weight:800;font-size:18px;padding-top:14px;margin-bottom:12px;\">Wallet<\/div>\n  <div style=\"border-radius:16px;padding:16px;margin-bottom:18px;background:linear-gradient(135deg,#16a34a,#15803d);\">\n    <div style=\"font-size:12px;color:#dcfce7;margin-bottom:4px;\">Total earned<\/div>\n    <div class=\"mono\" style=\"font-size:30px;font-weight:800;color:#fff;\">${inr(totalEarned)}<\/div>\n    <div style=\"font-size:12px;color:#dcfce7;margin-top:4px;\">Across ${hist.length} pickups \\u00b7 ${totalKg} kg<\/div>\n  <\/div>\n  <div style=\"font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;\">RECEIPTS<\/div>\n  ${hist.length===0 ? `<div class=\"muted\" style=\"font-size:12.5px;text-align:center;padding:30px 0;\">No completed pickups yet<\/div>` : hist.map(o=>{\n    const t = orderTotals(o);\n    const open = STATE.expanded===o.id;\n    return `<div class=\"card\" style=\"margin-bottom:10px;overflow:hidden;\">\n      <button onclick=\"toggleExpand('${o.id}')\" style=\"width:100%;text-align:left;padding:12px;display:flex;align-items:center;gap:10px;\">\n        <div style=\"width:34px;height:34px;border-radius:50%;background:#f4f4f5;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;\">${icon('receipt',15)}<\/div>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">${o.items.map(it=>it.name).join(', ')}<\/div>\n          <div class=\"muted\" style=\"font-size:11px;\">${o.slot} \\u00b7 ${t.weight} kg \\u00b7 ${o.payMethod==='upi'?'UPI':'Cash'}<\/div>\n        <\/div>\n        <div class=\"green mono\" style=\"font-size:13.5px;font-weight:800;flex-shrink:0;\">${inr(t.amount)}<\/div>\n      <\/button>\n      ${open?`<div style=\"border-top:1px solid var(--border);padding:10px 12px;\">\n        ${o.items.map(it=>`<div class=\"row between\" style=\"font-size:12px;margin-bottom:5px;\"><span class=\"muted\">${it.name} \\u00b7 ${it.qty.toFixed(1)} kg \\u00d7 ${inr(it.rate)}<\/span><span class=\"mono\">${inr(it.qty*it.rate)}<\/span><\/div>`).join('')}\n        <div class=\"row between\" style=\"font-size:12px;padding-top:6px;border-top:1px solid var(--border);margin-top:4px;\"><span style=\"font-weight:700;\">Total<\/span><span class=\"green mono\" style=\"font-weight:800;\">${inr(t.amount)}<\/span><\/div>\n      <\/div>`:''}\n    <\/div>`;\n  }).join('')}\n  `;\n}\n\nfunction profileScreen(){\n  const hist = myHistory();\n  const totalEarned = hist.reduce((s,o)=>s+orderTotals(o).amount,0);\n  const totalKg = Math.round(hist.reduce((s,o)=>s+orderTotals(o).weight,0)*10)/10;\n  const co2 = Math.round(totalKg*0.4);\n  const settings = ['Saved Addresses','Payment Methods','Notifications','Refer & Earn','Help & Support'];\n  return `\n  <div style=\"font-weight:800;font-size:18px;padding-top:14px;margin-bottom:14px;\">Profile<\/div>\n  <div class=\"card\" style=\"padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:14px;\">\n    <div style=\"width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px;\">A<\/div>\n    <div><div style=\"font-weight:700;font-size:14px;\">Arun Kumar<\/div><div class=\"muted\" style=\"font-size:11px;\">+91 98xxx xxx12 \\u00b7 Member since Jun 2026<\/div><\/div>\n  <\/div>\n  <div class=\"card\" style=\"padding:14px;margin-bottom:14px;\">\n    <div style=\"font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;\">${icon('leaf',13,'green')} Your impact<\/div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n      <div style=\"background:#f4f4f5;border-radius:12px;padding:10px;text-align:center;\"><div style=\"font-weight:800;\">${hist.length}<\/div><div class=\"muted\" style=\"font-size:10px;\">Pickups<\/div><\/div>\n      <div style=\"background:#f4f4f5;border-radius:12px;padding:10px;text-align:center;\"><div style=\"font-weight:800;\">${totalKg} kg<\/div><div class=\"muted\" style=\"font-size:10px;\">Recycled<\/div><\/div>\n      <div style=\"background:#f4f4f5;border-radius:12px;padding:10px;text-align:center;\"><div style=\"font-weight:800;\">${co2} kg<\/div><div class=\"muted\" style=\"font-size:10px;\">CO2e avoided<\/div><\/div>\n      <div style=\"background:#f4f4f5;border-radius:12px;padding:10px;text-align:center;\"><div style=\"font-weight:800;\">${Math.round(co2/21)}<\/div><div class=\"muted\" style=\"font-size:10px;\">Trees-equivalent<\/div><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    ${settings.map((s,i)=>`<button style=\"width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;${i<settings.length-1?'border-bottom:1px solid var(--border);':''}\"><span style=\"font-size:13px;color:#27272a;\">${s}<\/span><span style=\"color:#d4d4d8;\">${icon('chevronright',15)}<\/span><\/button>`).join('')}\n  <\/div>\n  `;\n}\n\nfunction customerApp(){\n  const NAV = [\n    { id:'home', label:'Home', icon:'home' },\n    { id:'schedule', label:'Schedule', icon:'calendar' },\n    { id:'track', label:'Track', icon:'truck' },\n    { id:'wallet', label:'Wallet', icon:'wallet' },\n    { id:'profile', label:'Profile', icon:'user' },\n  ];\n  let screen = '';\n  if(STATE.tab==='home') screen = homeScreen();\n  else if(STATE.tab==='schedule') screen = scheduleScreen();\n  else if(STATE.tab==='track') screen = trackScreen();\n  else if(STATE.tab==='wallet') screen = walletScreen();\n  else screen = profileScreen();\n\n  return `<div class=\"phone-wrap\"><div class=\"phone\">\n    <div class=\"notch\"><\/div>\n    <div class=\"phone-inner\">\n      <div class=\"status-bar\"><span style=\"font-weight:700;\">9:41<\/span><div class=\"icons\">${icon('signal',13)}${icon('wifi',13)}${icon('battery',15)}<\/div><\/div>\n      <div class=\"screen\">${screen}<\/div>\n      <div class=\"navbar\">\n        ${NAV.map(n=>`<button class=\"${STATE.tab===n.id?'active':''}\" onclick=\"setTab('${n.id}')\">${icon(n.icon,18)}<span>${n.label}<\/span><\/button>`).join('')}\n      <\/div>\n    <\/div>\n  <\/div><\/div>`;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Rider / Pilot app \\u2014 sees only pickups assigned to this rider          */\n/* ---------------------------------------------------------------------- */\nfunction setRiderTab(t){ STATE.riderTab=t; render(); }\nfunction riderJobs(name){\n  return STATE.orders.filter(o=>o.agent===name && o.status!=='Paid' && o.status!=='Cancelled');\n}\nfunction riderDone(name){\n  return STATE.orders.filter(o=>o.agent===name && o.status==='Paid');\n}\nfunction riderJobActions(o){\n  if(o.status==='Agent Assigned'){\n    return `<button class=\"job-btn jb-teal\" onclick=\"markOutForPickup('${o.id}')\">${icon('truck',15)} Start trip \\u2013 Out for Pickup<\/button>`;\n  }\n  if(o.status==='Out for Pickup'){\n    return `<button class=\"job-btn jb-purple\" onclick=\"startWeighing('${o.id}')\">${icon('zap',15)} Reached \\u2013 Start Weighing<\/button>`;\n  }\n  if(o.status==='Weighing'){\n    const draft = (STATE.editDraft && STATE.editDraft.orderId===o.id) ? STATE.editDraft.items : o.items;\n    const amt = draft.reduce((s,it)=>s+it.qty*it.rate,0);\n    return `<div class=\"weigh-r\">\n      <div style=\"font-size:10.5px;font-weight:800;color:#7c3aed;margin-bottom:6px;letter-spacing:.05em;\">ENTER WEIGHED QTY (kg)<\/div>\n      ${draft.map((it,i)=>`<div class=\"weigh-r-row\"><span>${it.name} \\u00b7 ${inr(it.rate)}/kg<\/span><span><input type=\"number\" step=\"0.1\" value=\"${it.qty}\" onchange=\"updateDraftQty(${i}, this.value)\"/><\/span><\/div>`).join('')}\n      <div class=\"weigh-r-row\" style=\"border-top:1px dashed #c4b5fd;padding-top:6px;margin-top:2px;\"><span style=\"font-weight:800;\">Payout<\/span><span style=\"font-weight:800;color:#15803d;\">${inr(amt)}<\/span><\/div>\n      <button class=\"job-btn jb-green\" onclick=\"releasePayment('${o.id}')\">${icon('wallet',15)} Confirm &amp; Credit Payment<\/button>\n    <\/div>`;\n  }\n  return '';\n}\nfunction riderApp(){\n  const me = RIDERS.find(r=>r.name===STATE.auth.name) || RIDERS[0];\n  const jobs = riderJobs(me.name);\n  const done = riderDone(me.name);\n  const outCount = jobs.filter(o=>o.status==='Out for Pickup'||o.status==='Weighing').length;\n  const collectedToday = done.filter(o=>o.date===daysAgo(0)).reduce((s,o)=>s+orderTotals(o).amount,0);\n\n  const NAV = [\n    { id:'jobs', label:'My Pickups', icon:'truck' },\n    { id:'done', label:'Completed', icon:'checkcircle' },\n    { id:'me', label:'Profile', icon:'user' },\n  ];\n\n  let screen='';\n  if(STATE.riderTab==='jobs'){\n    screen = `\n    <div class=\"rider-hero\">\n      <div class=\"row between\">\n        <div>\n          <div style=\"font-size:12px;color:#ccfbf1;\">Pilot on duty<\/div>\n          <div style=\"font-size:19px;font-weight:900;\">${me.name}<\/div>\n          <div style=\"font-size:11px;color:#ccfbf1;margin-top:2px;\">${icon('star',11)} ${me.rating} \\u00b7 ${me.zone}<\/div>\n        <\/div>\n        <div style=\"width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;\">${me.name[0]}<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"rider-stat-grid\">\n      <div class=\"rider-stat\"><div class=\"v\">${jobs.length}<\/div><div class=\"l\">Assigned to you<\/div><\/div>\n      <div class=\"rider-stat\"><div class=\"v\">${outCount}<\/div><div class=\"l\">In progress now<\/div><\/div>\n      <div class=\"rider-stat\"><div class=\"v\">${done.length}<\/div><div class=\"l\">Completed pickups<\/div><\/div>\n      <div class=\"rider-stat\"><div class=\"v\" style=\"color:var(--green);\">${inr(collectedToday)}<\/div><div class=\"l\">Credited today<\/div><\/div>\n    <\/div>\n    <div style=\"font-weight:800;font-size:14px;margin-bottom:10px;\">Your assigned pickups<\/div>\n    ${jobs.length===0 ? `<div class=\"card\" style=\"padding:26px;text-align:center;\" >${icon('checkcircle',26,'muted')}<div class=\"muted\" style=\"font-size:12.5px;margin-top:8px;\">No open pickups. Nice work \\u2014 you're all caught up.<\/div><\/div>` :\n      jobs.map(o=>{\n        const t = orderTotals(o);\n        return `<div class=\"job-card\">\n          <div class=\"row between\" style=\"margin-bottom:6px;\">\n            <span class=\"mono muted\" style=\"font-size:11px;\">${o.id}<\/span>\n            ${statusPill(o.status)}\n          <\/div>\n          <div class=\"job-cust\">${o.customerName}<\/div>\n          <div class=\"muted\" style=\"font-size:11.5px;margin:2px 0 8px;display:flex;align-items:center;gap:4px;\">${icon('mappin',12)} ${o.addressDetail}<\/div>\n          <div class=\"row between\" style=\"font-size:12px;background:#f4f4f5;border-radius:10px;padding:8px 10px;\">\n            <span>${o.items.map(it=>it.name+' \\u00b7 '+it.qty.toFixed(1)+'kg').join(', ')}<\/span>\n          <\/div>\n          <div class=\"row between\" style=\"font-size:11.5px;margin-top:8px;\">\n            <span class=\"muted\">${icon('clock',12)} ${o.slot}<\/span>\n            <span style=\"font-weight:800;\">${o.payMethod==='upi'?'UPI':'Cash'} \\u00b7 ~${inr(t.amount)}<\/span>\n          <\/div>\n          ${riderJobActions(o)}\n        <\/div>`;\n      }).join('')}\n    `;\n  } else if(STATE.riderTab==='done'){\n    const total = done.reduce((s,o)=>s+orderTotals(o).amount,0);\n    screen = `\n    <div style=\"font-weight:800;font-size:18px;padding-top:14px;margin-bottom:6px;\">Completed pickups<\/div>\n    <div class=\"muted\" style=\"font-size:12px;margin-bottom:14px;\">${done.length} pickups \\u00b7 ${inr(total)} credited to customers<\/div>\n    ${done.length===0 ? `<div class=\"muted\" style=\"text-align:center;padding:40px 0;font-size:12.5px;\">No completed pickups yet<\/div>` :\n      done.map(o=>{ const t=orderTotals(o); return `<div class=\"job-card\">\n        <div class=\"row between\"><div class=\"job-cust\" style=\"font-size:13.5px;\">${o.customerName}<\/div><span class=\"green mono\" style=\"font-weight:800;\">${inr(t.amount)}<\/span><\/div>\n        <div class=\"muted\" style=\"font-size:11px;margin-top:3px;\">${o.id} \\u00b7 ${t.weight} kg \\u00b7 ${fmtDate(o.date)}<\/div>\n      <\/div>`; }).join('')}\n    `;\n  } else {\n    screen = `\n    <div style=\"font-weight:800;font-size:18px;padding-top:14px;margin-bottom:14px;\">Profile<\/div>\n    <div class=\"card\" style=\"padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;\">\n      <div style=\"width:48px;height:48px;border-radius:50%;background:#0f766e;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;\">${me.name[0]}<\/div>\n      <div><div style=\"font-weight:800;font-size:15px;\">${me.name}<\/div><div class=\"muted\" style=\"font-size:11.5px;\">Pilot \\u00b7 ${me.phone}<\/div><\/div>\n    <\/div>\n    <div class=\"card\" style=\"padding:14px;\">\n      <div class=\"row between\" style=\"font-size:13px;padding:6px 0;\"><span class=\"muted\">Rating<\/span><span style=\"font-weight:700;\">${icon('star',12,'amber')} ${me.rating}<\/span><\/div>\n      <div class=\"row between\" style=\"font-size:13px;padding:6px 0;border-top:1px solid var(--border);\"><span class=\"muted\">Assigned zone<\/span><span style=\"font-weight:700;\">${me.zone}<\/span><\/div>\n      <div class=\"row between\" style=\"font-size:13px;padding:6px 0;border-top:1px solid var(--border);\"><span class=\"muted\">Lifetime pickups<\/span><span style=\"font-weight:700;\">${done.length}<\/span><\/div>\n    <\/div>\n    `;\n  }\n\n  return `<div class=\"phone-wrap\"><div class=\"phone\">\n    <div class=\"notch\"><\/div>\n    <div class=\"phone-inner\">\n      <div class=\"status-bar\"><span style=\"font-weight:700;\">9:41<\/span><div class=\"icons\">${icon('signal',13)}${icon('wifi',13)}${icon('battery',15)}<\/div><\/div>\n      <div class=\"screen\">${screen}<\/div>\n      <div class=\"navbar rider-navbar\">\n        ${NAV.map(n=>`<button class=\"${STATE.riderTab===n.id?'active':''}\" onclick=\"setRiderTab('${n.id}')\">${icon(n.icon,18)}<span>${n.label}<\/span><\/button>`).join('')}\n      <\/div>\n    <\/div>\n  <\/div><\/div>`;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Admin dashboard \\u2014 full operational control                          */\n/* ---------------------------------------------------------------------- */\nfunction adminActionsFor(o){\n  if(o.status==='Cancelled' || o.status==='Paid') return '<span style=\"color:#4b5563;font-size:11px;\">\\u2014<\/span>';\n  let html = '';\n  if(o.status==='Requested'){\n    html += `<button class=\"a3-btn a3-green\" onclick=\"acceptOrder('${o.id}')\">Accept<\/button>`;\n  } else if(o.status==='Accepted'){\n    html += `<select class=\"a3-select\" onchange=\"assignAgent('${o.id}', this.value)\">\n      <option value=\"\">Assign agent\\u2026<\/option>\n      ${AGENTS.map(a=>`<option value=\"${a}\">${a}<\/option>`).join('')}\n    <\/select>`;\n  } else if(o.status==='Agent Assigned'){\n    html += `<button class=\"a3-btn a3-blue\" onclick=\"markOutForPickup('${o.id}')\">Out for Pickup<\/button>`;\n  } else if(o.status==='Out for Pickup'){\n    html += `<button class=\"a3-btn a3-purple\" onclick=\"startWeighing('${o.id}')\">Start Weighing<\/button>`;\n  } else if(o.status==='Weighing'){\n    const draft = (STATE.editDraft && STATE.editDraft.orderId===o.id) ? STATE.editDraft.items : o.items;\n    html += `<div class=\"weigh3d\">\n      <div style=\"font-size:10.5px;font-weight:800;color:#c4b5fd;margin-bottom:5px;letter-spacing:.05em;\">ADJUST WEIGHED QTY<\/div>\n      ${draft.map((it,i)=>`<div class=\"weigh3d-row\"><span>${it.name}<\/span><span><input type=\"number\" step=\"0.1\" value=\"${it.qty}\" onchange=\"updateDraftQty(${i}, this.value)\"/> kg<\/span><\/div>`).join('')}\n      <button class=\"a3-btn a3-green\" style=\"margin-top:4px;\" onclick=\"releasePayment('${o.id}')\">Release Payment<\/button>\n    <\/div>`;\n  }\n  if(o.status!=='Weighing'){\n    html += `<button class=\"a3-btn a3-red\" onclick=\"cancelOrder('${o.id}')\">Cancel<\/button>`;\n  }\n  return html;\n}\n\nfunction pill3d(status){\n  const colorMap = {\n    Requested:'#f59e0b', Accepted:'#818cf8', 'Agent Assigned':'#38bdf8', 'Out for Pickup':'#60a5fa',\n    Weighing:'#a78bfa', Paid:'#34d399', Cancelled:'#f87171',\n  };\n  const c = colorMap[status] || '#9ca3af';\n  return `<span class=\"pill3d\" style=\"background:${c}22;color:${c};\">${status}<\/span>`;\n}\n\nfunction setBizPeriod(p){ STATE.bizPeriod=p; render(); }\nfunction customerBusiness(period){\n  const days = period==='week' ? 7 : period==='month' ? 30 : 365;\n  const cutoff = daysAgo(days);\n  const live = STATE.orders.filter(o=>o.status==='Paid').map(o=>({\n    customer:o.customerName, date:o.date||daysAgo(0), weight:orderTotals(o).weight, amount:orderTotals(o).amount\n  }));\n  const txns = BUSINESS_LEDGER.concat(live).filter(t=>t.date>=cutoff);\n  const map = {};\n  txns.forEach(t=>{\n    const m = map[t.customer] || (map[t.customer]={orders:0,kg:0,amount:0});\n    m.orders++; m.kg+=t.weight; m.amount+=t.amount;\n  });\n  return Object.keys(map).map(c=>({customer:c, ...map[c]})).sort((a,b)=>b.amount-a.amount);\n}\n\n/* ---------------------------------------------------------------------- */\n/* ERP \\u2014 Inventory / Sales / Ledger / Reports                          */\n/* ---------------------------------------------------------------------- */\nfunction setErpTab(t){ STATE.erpTab=t; render(); }\n\nfunction purchasedByCategory(){\n  const map = {}; CATEGORIES.forEach(c=>map[c.name]=0);\n  STATE.orders.filter(o=>o.status==='Paid').forEach(o=>{\n    o.items.forEach(it=>{ map[it.name] = (map[it.name]||0) + it.qty; });\n  });\n  return map;\n}\nfunction soldByCategory(){\n  const map = {}; CATEGORIES.forEach(c=>map[c.name]=0);\n  STATE.sales.forEach(s=>{ map[s.category] = (map[s.category]||0) + s.qty; });\n  return map;\n}\nfunction stockByCategory(){\n  const p = purchasedByCategory(), s = soldByCategory();\n  return CATEGORIES.map(c=>{\n    const purchased = p[c.name]||0, sold = s[c.name]||0;\n    const opening = OPENING_STOCK[c.name]||0;\n    const stock = Math.round((opening+purchased-sold)*10)/10;\n    return { ...c, opening, purchased, sold, stock };\n  });\n}\nfunction prefillSaleInfo(catName){\n  const rateEl = document.getElementById('so-rate');\n  if(rateEl) rateEl.value = SALE_RATE[catName]||'';\n  const availEl = document.getElementById('so-avail');\n  if(availEl){\n    const row = stockByCategory().find(c=>c.name===catName);\n    availEl.textContent = row ? row.stock.toFixed(1)+' kg available in warehouse' : '';\n  }\n}\nfunction createSale(){\n  const catName = document.getElementById('so-cat').value;\n  const buyerName = document.getElementById('so-buyer').value;\n  const qtyReq = parseFloat(document.getElementById('so-qty').value)||0;\n  const rate = parseFloat(document.getElementById('so-rate').value) || (SALE_RATE[catName]||0);\n  const row = stockByCategory().find(c=>c.name===catName);\n  const avail = row ? row.stock : 0;\n  const qty = Math.round(Math.min(qtyReq, avail)*10)/10;\n  if(qty<=0 || !buyerName) return;\n  saleSeq += 1;\n  STATE.sales = [{ id:'SO-'+saleSeq, buyer:buyerName, category:catName, qty, rate, amount:Math.round(qty*rate), date:daysAgo(0) }, ...STATE.sales];\n  render();\n}\nfunction ledgerRows(period){\n  const days = period==='week'?7:period==='month'?30:period==='year'?365:100000;\n  const cutoff = daysAgo(days);\n  const purchases = STATE.orders.filter(o=>o.status==='Paid').map(o=>({\n    date:o.date||daysAgo(0), type:'Purchase', party:o.customerName,\n    detail:o.items.map(it=>it.name).join(', '), amount:orderTotals(o).amount,\n  }));\n  const sales = STATE.sales.map(s=>({\n    date:s.date, type:'Sale', party:s.buyer, detail:s.category+' \\u00b7 '+s.qty.toFixed(1)+' kg', amount:s.amount,\n  }));\n  return purchases.concat(sales).filter(r=>r.date>=cutoff).sort((a,b)=> b.date<a.date?-1:b.date>a.date?1:0);\n}\nfunction categoryReport(){\n  const purchased = purchasedByCategory();\n  return CATEGORIES.map(c=>{\n    const purchaseCost = STATE.orders.filter(o=>o.status==='Paid').reduce((s,o)=>{\n      const it = o.items.find(x=>x.name===c.name); return it ? s+it.qty*it.rate : s;\n    },0);\n    const catSales = STATE.sales.filter(s=>s.category===c.name);\n    const soldQty = catSales.reduce((s,x)=>s+x.qty,0);\n    const saleRevenue = catSales.reduce((s,x)=>s+x.amount,0);\n    const margin = catSales.reduce((s,x)=> s + x.qty*(x.rate - c.rate), 0);\n    const avgSaleRate = soldQty>0 ? saleRevenue/soldQty : 0;\n    return { name:c.name, purchasedQty:purchased[c.name]||0, purchaseRate:c.rate, soldQty, avgSaleRate, saleRevenue, margin };\n  });\n}\n\nfunction adminOpsTab(){\n  const orders = STATE.orders;\n  const filtered = STATE.adminFilter==='All' ? orders : orders.filter(o=>o.status===STATE.adminFilter);\n\n  const todayPickups = 14 + orders.filter(o=>o.source==='customer').length;\n  const paidToday = orders.filter(o=>o.status==='Paid');\n  const todayKg = 486 + Math.round(paidToday.reduce((s,o)=>s+orderTotals(o).weight,0));\n  const todayRevenue = 18240 + Math.round(paidToday.reduce((s,o)=>s+orderTotals(o).amount,0));\n\n  const maxTotal = Math.max(...WEEKLY_VOLUME.map(d=>d.metal+d.ewaste+d.paper+d.plastic+d.household));\n  const catHex = {metal:'#a1a1aa',ewaste:'#38bdf8',paper:'#fbbf24',plastic:'#16a34a',household:'#fb923c'};\n  const chartCols = WEEKLY_VOLUME.map(d=>{\n    const total = d.metal+d.ewaste+d.paper+d.plastic+d.household;\n    const h = (total/maxTotal)*190;\n    const segs = ['metal','ewaste','paper','plastic','household'].map(k=>{\n      const segH = (d[k]/total)*h;\n      const hex = catHex[k];\n      return `<div class=\"chart3d-seg\" style=\"height:${segH}px;background:linear-gradient(180deg, ${hex}, ${hex}cc);box-shadow:0 0 14px ${hex}66, inset 0 1px 0 rgba(255,255,255,.4);\"><\/div>`;\n    }).join('');\n    return `<div class=\"chart3d-col\"><div class=\"chart3d-stack\" style=\"height:${h}px;\">${segs}<\/div><div class=\"chart3d-day\">${d.day}<\/div><\/div>`;\n  }).join('');\n\n  const kpis = [\n    { icon:'package', label:'Pickups today', value:todayPickups, grad:'linear-gradient(135deg,#22c55e,#0ea55e)' },\n    { icon:'trending', label:'Kg collected today', value:todayKg+' kg', grad:'linear-gradient(135deg,#38bdf8,#0ea5e9)' },\n    { icon:null, label:'Revenue today', value:inr(todayRevenue), grad:'linear-gradient(135deg,#fbbf24,#d97706)' },\n    { icon:'users', label:'Active collectors', value:6, grad:'linear-gradient(135deg,#a78bfa,#7c3aed)' },\n  ];\n\n  return `\n    <div class=\"row between\" style=\"margin-bottom:18px;flex-wrap:wrap;gap:12px;\">\n      <div class=\"neon-sub\">Purchase side \\u2014 pickups coming in from customers<\/div>\n      <button class=\"neon-btn\" onclick=\"toggleManualForm()\">${STATE.showManualForm?'Close':'+ Add Walk-in Order'}<\/button>\n    <\/div>\n\n    ${STATE.showManualForm ? `<div class=\"glass3d\" style=\"padding:18px;margin-bottom:22px;\">\n      <div class=\"manual3d\">\n        <div><label>Customer name<\/label><input id=\"mf-name\" placeholder=\"e.g. Kavitha Textiles\"/><\/div>\n        <div><label>Area<\/label><input id=\"mf-area\" placeholder=\"e.g. Gandhipuram\"/><\/div>\n        <div><label>Category<\/label><select id=\"mf-cat\">${CATEGORIES.map(c=>`<option value=\"${c.name}\">${c.name}<\/option>`).join('')}<\/select><\/div>\n        <div><label>Weight (kg)<\/label><input id=\"mf-qty\" type=\"number\" step=\"0.1\" value=\"10\"/><\/div>\n        <button class=\"neon-btn\" onclick=\"addManualOrder()\">Add Order<\/button>\n      <\/div>\n    <\/div>` : ''}\n\n    <div class=\"persp kpi3d-row\">\n      ${kpis.map(k=>`<div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:${k.grad};color:#04140d;\">${k.icon?icon(k.icon,18):'<span style=\"font-weight:900;font-size:16px;\">\\u20b9<\/span>'}<\/div>\n        <div class=\"kpi3d-value\">${k.value}<\/div>\n        <div class=\"kpi3d-label\">${k.label}<\/div>\n      <\/div>`).join('')}\n    <\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d chart3d-panel\">\n      <div class=\"chart3d-title\">Weekly volume by category (kg)<\/div>\n      <div class=\"neon-sub\" style=\"margin-bottom:2px;\">Collection volume across the week<\/div>\n      <div class=\"chart3d-cols\">${chartCols}<\/div>\n      <div class=\"legend3d\">\n        <div class=\"legend3d-item\"><span class=\"legend3d-dot\" style=\"background:${catHex.metal};color:${catHex.metal};\"><\/span>Metal<\/div>\n        <div class=\"legend3d-item\"><span class=\"legend3d-dot\" style=\"background:${catHex.ewaste};color:${catHex.ewaste};\"><\/span>E-Waste<\/div>\n        <div class=\"legend3d-item\"><span class=\"legend3d-dot\" style=\"background:${catHex.paper};color:${catHex.paper};\"><\/span>Paper<\/div>\n        <div class=\"legend3d-item\"><span class=\"legend3d-dot\" style=\"background:${catHex.plastic};color:${catHex.plastic};\"><\/span>Plastic<\/div>\n        <div class=\"legend3d-item\"><span class=\"legend3d-dot\" style=\"background:${catHex.household};color:${catHex.household};\"><\/span>Household<\/div>\n      <\/div>\n    <\/div><\/div>\n\n    ${(function(){\n      const period = STATE.bizPeriod;\n      const rows = customerBusiness(period);\n      const periodLabel = period==='week'?'last 7 days':period==='month'?'last 30 days':'last 12 months';\n      const grandRevenue = rows.reduce((s,r)=>s+r.amount,0);\n      const grandKg = rows.reduce((s,r)=>s+r.kg,0);\n      const maxRev = Math.max(1, ...rows.map(r=>r.amount));\n      return `<div class=\"persp\"><div class=\"tilt3d glass3d chart3d-panel\">\n        <div class=\"row between\" style=\"margin-bottom:12px;flex-wrap:wrap;gap:10px;\">\n          <div>\n            <div class=\"chart3d-title\">Business by customer<\/div>\n            <div class=\"neon-sub\">${rows.length} customers \\u00b7 ${periodLabel} \\u00b7 ${Math.round(grandKg).toLocaleString('en-IN')} kg \\u00b7 <span style=\"color:#16a34a;font-weight:800;\">${inr(grandRevenue)}<\/span><\/div>\n          <\/div>\n          <div class=\"biz-toggle\">\n            <button class=\"${period==='week'?'active':''}\" onclick=\"setBizPeriod('week')\">Weekly<\/button>\n            <button class=\"${period==='month'?'active':''}\" onclick=\"setBizPeriod('month')\">Monthly<\/button>\n            <button class=\"${period==='year'?'active':''}\" onclick=\"setBizPeriod('year')\">Yearly<\/button>\n          <\/div>\n        <\/div>\n        ${rows.length===0 ? `<div class=\"tip3d\">No business recorded in this period.<\/div>` : rows.map(r=>`\n          <div class=\"biz-row\">\n            <div style=\"width:140px;min-width:120px;font-weight:700;color:#111827;font-size:12.5px;\">${r.customer}<\/div>\n            <div class=\"biz-bar-track\"><div class=\"biz-bar-fill\" style=\"width:${Math.max(6,Math.round(r.amount/maxRev*100))}%;\"><\/div><\/div>\n            <div style=\"width:150px;text-align:right;font-size:11.5px;color:#6b7280;\">\n              <span style=\"color:#16a34a;font-weight:800;\">${inr(r.amount)}<\/span> \\u00b7 ${Math.round(r.kg).toLocaleString('en-IN')}kg \\u00b7 ${r.orders} ord\n            <\/div>\n          <\/div>`).join('')}\n      <\/div><\/div>`;\n    })()}\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d queue3d-panel\">\n      <div class=\"row between\" style=\"margin-bottom:12px;\">\n        <div style=\"font-weight:800;font-size:14.5px;color:#111827;\">Live pickup queue \\u2014 edit &amp; control orders<\/div>\n        <span style=\"color:#6b7280;\">${icon('filter',14)}<\/span>\n      <\/div>\n      <div style=\"margin-bottom:6px;\">\n        ${['All',...STATUSES,'Cancelled'].map(f=>`<button class=\"filter3d ${STATE.adminFilter===f?'active':''}\" onclick=\"setAdminFilter('${f}')\">${f}<\/button>`).join('')}\n      <\/div>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"t3d\">\n          <thead><tr><th>ID<\/th><th>Customer<\/th><th>Area<\/th><th>Categories<\/th><th>Weight<\/th><th>Amount<\/th><th>Status<\/th><th>Agent<\/th><th>Actions<\/th><\/tr><\/thead>\n          <tbody>\n            ${filtered.map(o=>{\n              const t = orderTotals(o);\n              return `<tr>\n                <td class=\"mono\" style=\"font-size:11px;color:#6b7280;\">${o.id}${o.source==='customer'?' <span style=\"color:#16a34a;font-weight:800;\">\\u25cf app<\/span>':''}<\/td>\n                <td style=\"font-weight:700;color:#111827;\">${o.customerName}<\/td>\n                <td>${o.area}<\/td>\n                <td>${o.items.map(it=>it.name).join(', ')}<\/td>\n                <td class=\"mono\">${t.weight.toFixed(1)} kg<\/td>\n                <td class=\"mono\">${inr(t.amount)}<\/td>\n                <td>${pill3d(o.status)}<\/td>\n                <td>${o.agent || '\\u2014'}<\/td>\n                <td style=\"min-width:160px;\">${adminActionsFor(o)}<\/td>\n              <\/tr>`;\n            }).join('')}\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div><\/div>\n  `;\n}\n\nfunction adminInventoryTab(){\n  const stock = stockByCategory();\n  const totalStock = stock.reduce((s,c)=>s+c.stock,0);\n  const totalValue = stock.reduce((s,c)=>s+c.stock*c.rate,0);\n  const lowStock = stock.filter(c=>c.stock < 40).length;\n\n  return `\n    <div class=\"neon-sub\" style=\"margin-bottom:18px;\">Warehouse stock \\u2014 opening balance + purchases (paid pickups) \\u2212 sales dispatched<\/div>\n    <div class=\"persp kpi3d-row\">\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#22c55e,#0ea55e);color:#04140d;\">${icon('package',18)}<\/div>\n        <div class=\"kpi3d-value\">${Math.round(totalStock).toLocaleString('en-IN')} kg<\/div>\n        <div class=\"kpi3d-label\">Total stock on hand<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#fbbf24,#d97706);color:#04140d;\"><span style=\"font-weight:900;font-size:16px;\">\\u20b9<\/span><\/div>\n        <div class=\"kpi3d-value\">${inr(totalValue)}<\/div>\n        <div class=\"kpi3d-label\">Stock value at purchase rate<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#f87171,#b91c1c);color:#04140d;\">${icon('trending',18)}<\/div>\n        <div class=\"kpi3d-value\">${lowStock}<\/div>\n        <div class=\"kpi3d-label\">Categories running low (&lt;40kg)<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d queue3d-panel\">\n      <div style=\"font-weight:800;font-size:14.5px;color:#111827;margin-bottom:12px;\">Stock ledger by category<\/div>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"t3d\">\n          <thead><tr><th>Category<\/th><th>Opening<\/th><th>Purchased<\/th><th>Sold<\/th><th>Current Stock<\/th><th>Level<\/th><\/tr><\/thead>\n          <tbody>\n            ${stock.map(c=>{\n              const pct = Math.max(4, Math.min(100, Math.round((c.stock/Math.max(1,c.opening+c.purchased))*100)));\n              const low = c.stock < 40;\n              return `<tr>\n                <td style=\"font-weight:700;color:#111827;\">${c.name}<\/td>\n                <td class=\"mono\">${c.opening.toFixed(1)} kg<\/td>\n                <td class=\"mono\" style=\"color:#16a34a;\">+${c.purchased.toFixed(1)} kg<\/td>\n                <td class=\"mono\" style=\"color:#f87171;\">-${c.sold.toFixed(1)} kg<\/td>\n                <td class=\"mono\" style=\"font-weight:800;color:${low?'#f87171':'#e5e7eb'};\">${c.stock.toFixed(1)} kg<\/td>\n                <td><div class=\"biz-bar-track\" style=\"width:100px;\"><div class=\"biz-bar-fill\" style=\"width:${pct}%;${low?'background:linear-gradient(90deg,#f87171,#ef4444);':''}\"><\/div><\/div><\/td>\n              <\/tr>`;\n            }).join('')}\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div><\/div>\n  `;\n}\n\nfunction adminSalesTab(){\n  const stock = stockByCategory();\n  const defaultCat = CATEGORIES[0];\n  const defaultStock = stock.

find(c=>c.name===defaultCat.name);\n  const totalSales = STATE.sales.reduce((s,x)=>s+x.amount,0);\n  const totalQty = STATE.sales.reduce((s,x)=>s+x.qty,0);\n\n  return `\n    <div class=\"neon-sub\" style=\"margin-bottom:18px;\">Sell warehouse stock forward to bulk buyers, foundries &amp; recyclers<\/div>\n    <div class=\"persp kpi3d-row\">\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#04140d;\">${icon('trending',18)}<\/div>\n        <div class=\"kpi3d-value\">${inr(totalSales)}<\/div>\n        <div class=\"kpi3d-label\">Total sales revenue<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#22c55e,#0ea55e);color:#04140d;\">${icon('package',18)}<\/div>\n        <div class=\"kpi3d-value\">${Math.round(totalQty).toLocaleString('en-IN')} kg<\/div>\n        <div class=\"kpi3d-label\">Total quantity dispatched<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#04140d;\">${icon('users',18)}<\/div>\n        <div class=\"kpi3d-value\">${BUYERS.length}<\/div>\n        <div class=\"kpi3d-label\">Registered buyers<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d\" style=\"padding:18px;margin-bottom:24px;\">\n      <div style=\"font-weight:800;font-size:14.5px;color:#111827;margin-bottom:12px;\">Create sales order<\/div>\n      <div class=\"manual3d\" style=\"grid-template-columns:1fr 1.3fr .8fr .8fr auto;\">\n        <div><label>Category<\/label><select id=\"so-cat\" onchange=\"prefillSaleInfo(this.value)\">${CATEGORIES.map(c=>`<option value=\"${c.name}\">${c.name}<\/option>`).join('')}<\/select><\/div>\n        <div><label>Buyer<\/label><select id=\"so-buyer\">${BUYERS.map(b=>`<option value=\"${b.name}\">${b.name}<\/option>`).join('')}<\/select><\/div>\n        <div><label>Qty (kg)<\/label><input id=\"so-qty\" type=\"number\" step=\"0.1\" value=\"20\"/><\/div>\n        <div><label>Rate (\\u20b9/kg)<\/label><input id=\"so-rate\" type=\"number\" step=\"0.5\" value=\"${SALE_RATE[defaultCat.name]}\"/><\/div>\n        <button class=\"neon-btn\" onclick=\"createSale()\">Record Sale<\/button>\n      <\/div>\n      <div id=\"so-avail\" class=\"neon-sub\">${defaultStock?defaultStock.stock.toFixed(1):'0.0'} kg available in warehouse<\/div>\n    <\/div><\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d queue3d-panel\">\n      <div style=\"font-weight:800;font-size:14.5px;color:#111827;margin-bottom:12px;\">Sales order history<\/div>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"t3d\">\n          <thead><tr><th>ID<\/th><th>Date<\/th><th>Buyer<\/th><th>Category<\/th><th>Qty<\/th><th>Rate<\/th><th>Amount<\/th><\/tr><\/thead>\n          <tbody>\n            ${STATE.sales.map(s=>`<tr>\n              <td class=\"mono\" style=\"font-size:11px;color:#6b7280;\">${s.id}<\/td>\n              <td class=\"mono\" style=\"font-size:11px;\">${fmtDate(s.date)}<\/td>\n              <td style=\"font-weight:700;color:#111827;\">${s.buyer}<\/td>\n              <td>${s.category}<\/td>\n              <td class=\"mono\">${s.qty.toFixed(1)} kg<\/td>\n              <td class=\"mono\">${inr(s.rate)}/kg<\/td>\n              <td class=\"mono\" style=\"color:#16a34a;font-weight:800;\">${inr(s.amount)}<\/td>\n            <\/tr>`).join('')}\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div><\/div>\n  `;\n}\n\nfunction setLedgerPeriod(p){ STATE.ledgerPeriod=p; render(); }\nfunction adminLedgerTab(){\n  const period = STATE.ledgerPeriod;\n  const rows = ledgerRows(period);\n  const totalPurchase = rows.filter(r=>r.type==='Purchase').reduce((s,r)=>s+r.amount,0);\n  const totalSale = rows.filter(r=>r.type==='Sale').reduce((s,r)=>s+r.amount,0);\n  const net = totalSale - totalPurchase;\n\n  return `\n    <div class=\"row between\" style=\"margin-bottom:18px;flex-wrap:wrap;gap:10px;\">\n      <div class=\"neon-sub\">Cash ledger \\u2014 payouts to customers vs receipts from buyers<\/div>\n      <div class=\"biz-toggle\">\n        <button class=\"${period==='week'?'active':''}\" onclick=\"setLedgerPeriod('week')\">Week<\/button>\n        <button class=\"${period==='month'?'active':''}\" onclick=\"setLedgerPeriod('month')\">Month<\/button>\n        <button class=\"${period==='year'?'active':''}\" onclick=\"setLedgerPeriod('year')\">Year<\/button>\n        <button class=\"${period==='all'?'active':''}\" onclick=\"setLedgerPeriod('all')\">All<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"persp kpi3d-row\">\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#f87171,#b91c1c);color:#04140d;\">${icon('wallet',18)}<\/div>\n        <div class=\"kpi3d-value\">${inr(totalPurchase)}<\/div>\n        <div class=\"kpi3d-label\">Paid out to customers<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#22c55e,#0ea55e);color:#04140d;\">${icon('trending',18)}<\/div>\n        <div class=\"kpi3d-value\">${inr(totalSale)}<\/div>\n        <div class=\"kpi3d-label\">Received from buyers<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#04140d;\"><span style=\"font-weight:900;font-size:16px;\">\\u20b9<\/span><\/div>\n        <div class=\"kpi3d-value\" style=\"color:${net>=0?'#4ade80':'#f87171'};\">${net>=0?'':'-'}${inr(Math.abs(net))}<\/div>\n        <div class=\"kpi3d-label\">Net cash position<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d queue3d-panel\">\n      <div style=\"font-weight:800;font-size:14.5px;color:#111827;margin-bottom:12px;\">Ledger entries<\/div>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"t3d\">\n          <thead><tr><th>Date<\/th><th>Type<\/th><th>Party<\/th><th>Detail<\/th><th>Amount<\/th><\/tr><\/thead>\n          <tbody>\n            ${rows.length===0 ? `<tr><td colspan=\"5\" style=\"text-align:center;color:#6b7280;\">No entries in this period<\/td><\/tr>` : rows.map(r=>`<tr>\n              <td class=\"mono\" style=\"font-size:11px;\">${fmtDate(r.date)}<\/td>\n              <td><span class=\"pill3d\" style=\"background:${r.type==='Sale'?'#22c55e22':'#f8717122'};color:${r.type==='Sale'?'#4ade80':'#f87171'};\">${r.type}<\/span><\/td>\n              <td style=\"font-weight:700;color:#111827;\">${r.party}<\/td>\n              <td style=\"color:#6b7280;\">${r.detail}<\/td>\n              <td class=\"mono\" style=\"font-weight:800;color:${r.type==='Sale'?'#4ade80':'#f87171'};\">${r.type==='Sale'?'+':'-'}${inr(r.amount)}<\/td>\n            <\/tr>`).join('')}\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div><\/div>\n  `;\n}\n\nfunction adminReportsTab(){\n  const report = categoryReport();\n  const totalMargin = report.reduce((s,r)=>s+r.margin,0);\n  const totalRevenue = report.reduce((s,r)=>s+r.saleRevenue,0);\n  const marginPct = totalRevenue>0 ? (totalMargin/totalRevenue*100) : 0;\n\n  return `\n    <div class=\"neon-sub\" style=\"margin-bottom:18px;\">Profitability \\u2014 realized margin between purchase rate and sale rate, per category<\/div>\n    <div class=\"persp kpi3d-row\">\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#22c55e,#0ea55e);color:#04140d;\"><span style=\"font-weight:900;font-size:16px;\">\\u20b9<\/span><\/div>\n        <div class=\"kpi3d-value\">${inr(totalMargin)}<\/div>\n        <div class=\"kpi3d-label\">Realized gross margin<\/div>\n      <\/div>\n      <div class=\"tilt3d glass3d kpi3d\">\n        <div class=\"kpi3d-icon\" style=\"background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#04140d;\">${icon('trending',18)}<\/div>\n        <div class=\"kpi3d-value\">${marginPct.toFixed(1)}%<\/div>\n        <div class=\"kpi3d-label\">Overall margin on sales<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"persp\"><div class=\"tilt3d glass3d queue3d-panel\">\n      <div style=\"font-weight:800;font-size:14.5px;color:#111827;margin-bottom:12px;\">Category P&amp;L (all-time)<\/div>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"t3d\">\n          <thead><tr><th>Category<\/th><th>Purchased<\/th><th>Buy Rate<\/th><th>Sold<\/th><th>Avg Sell Rate<\/th><th>Sale Revenue<\/th><th>Margin<\/th><\/tr><\/thead>\n          <tbody>\n            ${report.map(r=>`<tr>\n              <td style=\"font-weight:700;color:#111827;\">${r.name}<\/td>\n              <td class=\"mono\">${r.purchasedQty.toFixed(1)} kg<\/td>\n              <td class=\"mono\">${inr(r.purchaseRate)}/kg<\/td>\n              <td class=\"mono\">${r.soldQty.toFixed(1)} kg<\/td>\n              <td class=\"mono\">${r.soldQty>0?inr(r.avgSaleRate)+'/kg':'\\u2014'}<\/td>\n              <td class=\"mono\">${inr(r.saleRevenue)}<\/td>\n              <td class=\"mono\" style=\"font-weight:800;color:${r.margin>=0?'#4ade80':'#f87171'};\">${inr(r.margin)}<\/td>\n            <\/tr>`).join('')}\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div><\/div>\n  `;\n}\n\nfunction adminDashboard(){\n  const liveOrders = STATE.orders.filter(o=>o.status!=='Paid' && o.status!=='Cancelled');\n  const TABS = [\n    ['ops','Operations'], ['inventory','Inventory'], ['sales','Sales'], ['ledger','Ledger'], ['reports','Reports'],\n  ];\n  let content = '';\n  if(STATE.erpTab==='ops') content = adminOpsTab();\n  else if(STATE.erpTab==='inventory') content = adminInventoryTab();\n  else if(STATE.erpTab==='sales') content = adminSalesTab();\n  else if(STATE.erpTab==='ledger') content = adminLedgerTab();\n  else content = adminReportsTab();\n\n  return `<div class=\"admin3d-outer\">\n    <div class=\"glow-orb\" style=\"width:340px;height:340px;background:#22c55e;top:-140px;left:-80px;\"><\/div>\n    <div class=\"glow-orb\" style=\"width:300px;height:300px;background:#a78bfa;top:60px;right:-100px;\"><\/div>\n    <div class=\"glow-orb\" style=\"width:260px;height:260px;background:#38bdf8;bottom:-100px;left:40%;\"><\/div>\n    <div class=\"floor-grid\"><\/div>\n\n    <div class=\"admin3d\">\n      <div style=\"margin-bottom:18px;\">\n        <div class=\"neon-title\">${icon('recycle',20)} GreenEcoCity Admin \\u2014 ERP Console<\/div>\n        <div class=\"neon-sub\">Coimbatore Operations \\u00b7 ${liveOrders.length} orders in motion \\u00b7 Purchase \\u2192 Inventory \\u2192 Sales \\u2192 Ledger<\/div>\n      <\/div>\n\n      <div style=\"margin-bottom:22px;\">\n        ${TABS.map(([id,label])=>`<button class=\"filter3d ${STATE.erpTab===id?'active':''}\" style=\"font-size:12.5px;padding:8px 16px;\" onclick=\"setErpTab('${id}')\">${label}<\/button>`).join('')}\n      <\/div>\n\n      ${content}\n    <\/div>\n  <\/div>`;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Login / role gate                                                      */\n/* ---------------------------------------------------------------------- */\nfunction loginScreen(){\n  const roles = [\n    { id:'customer', name:'Customer', icon:'user',  grad:'linear-gradient(135deg,#22c55e,#0ea55e)', desc:'Book a pickup, watch it weighed live, get paid.' },\n    { id:'rider',    name:'Rider / Pilot', icon:'truck', grad:'linear-gradient(135deg,#2dd4bf,#0f766e)', desc:'See pickups assigned to you and run them.' },\n    { id:'admin',    name:'Admin', icon:'shield', grad:'linear-gradient(135deg,#a78bfa,#7c3aed)', desc:'Control the whole operation & see business.' },\n  ];\n\n  let sub = '';\n  if(STATE.loginRole==='customer'){\n    sub = `<div class=\"login-sub\">\n      <div class=\"login-sub-title\">Choose a customer account<\/div>\n      <div class=\"acct-grid\">\n        ${CUSTOMERS.map((c,i)=>{\n          const hues=['#22c55e','#38bdf8','#a78bfa','#fbbf24','#fb923c','#f87171'];\n          return `<button class=\"acct-btn\" onclick=\"loginAs('customer','${c.replace(/'/g,\"\\\\'\")}')\">\n            <span class=\"acct-av\" style=\"background:${hues[i%hues.length]}22;color:${hues[i%hues.length]};\">${c[0]}<\/span>\n            <span><span style=\"font-weight:700;font-size:13px;display:block;\">${c}<\/span><span style=\"font-size:10.5px;color:#8b93a7;\">${c==='Arun Kumar'?'demo account':'view their bookings'}<\/span><\/span>\n          <\/button>`;\n        }).join('')}\n      <\/div>\n    <\/div>`;\n  } else if(STATE.loginRole==='rider'){\n    sub = `<div class=\"login-sub\">\n      <div class=\"login-sub-title\">Sign in as a rider / pilot<\/div>\n      <div class=\"acct-grid\">\n        ${RIDERS.map(r=>`<button class=\"acct-btn\" onclick=\"loginAs('rider','${r.name}')\">\n          <span class=\"acct-av\" style=\"background:#0f766e22;color:#2dd4bf;\">${r.name[0]}<\/span>\n          <span><span style=\"font-weight:700;font-size:13px;display:block;\">${r.name}<\/span><span style=\"font-size:10.5px;color:#8b93a7;\">${icon('star',10)} ${r.rating} \\u00b7 ${r.zone}<\/span><\/span>\n        <\/button>`).join('')}\n      <\/div>\n    <\/div>`;\n  } else if(STATE.loginRole==='admin'){\n    sub = `<div class=\"login-sub\">\n      <div class=\"login-sub-title\">Operations console<\/div>\n      <div class=\"row between\" style=\"flex-wrap:wrap;gap:10px;\">\n        <div style=\"font-size:12.5px;color:#9aa2b2;\">Full access to the pickup queue, weighing control and customer business reports.<\/div>\n        <button class=\"neon-btn\" onclick=\"loginAs('admin')\">Enter Admin Console<\/button>\n      <\/div>\n    <\/div>`;\n  }\n\n  return `<div class=\"login-wrap\">\n    <div class=\"login-hero\">\n      <span class=\"login-badge\">${icon('recycle',13)} GREENECOCITY<\/span>\n      <div class=\"login-h1\">Weigh it. Sell it. Get paid instantly.<\/div>\n      <div class=\"login-p\">One connected platform for scrap pickups \\u2014 sign in to your portal. Every action a rider takes flows live to the customer's track screen and the admin console.<\/div>\n      <div class=\"role-grid\">\n        ${roles.map(r=>`<button class=\"role-card ${STATE.loginRole===r.id?'sel':''}\" onclick=\"chooseRole('${r.id}')\">\n          <div class=\"role-ic\" style=\"background:${r.grad};\">${icon(r.icon,22)}<\/div>\n          <div class=\"role-name\">${r.name}<\/div>\n          <div class=\"role-desc\">${r.desc}<\/div>\n        <\/button>`).join('')}\n      <\/div>\n      ${sub}\n    <\/div>\n    <div class=\"tip3d\" style=\"color:#8a8a8a;\">Prototype \\u00b7 pick any account above \\u2014 no password needed for the demo.<\/div>\n  <\/div>`;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Root render                                                            */\n/* ---------------------------------------------------------------------- */\nfunction render(){\n  const root = document.getElementById('root');\n\n  if(!STATE.auth){\n    root.innerHTML = `<div class=\"page\">${loginScreen()}<\/div>`;\n    return;\n  }\n\n  const roleMeta = {\n    customer:{ label:'Customer', tag:STATE.auth.customer, av:'#22c55e' },\n    rider:{ label:'Rider / Pilot', tag:STATE.auth.name, av:'#0f766e' },\n    admin:{ label:'Admin', tag:'Operations Console', av:'#7c3aed' },\n  }[STATE.auth.role];\n\n  let body='';\n  if(STATE.auth.role==='customer') body = customerApp();\n  else if(STATE.auth.role==='rider') body = riderApp();\n  else body = adminDashboard();\n\n  root.innerHTML = `\n  <div class=\"page\">\n    <div class=\"topbar\">\n      <div>\n        <div class=\"brand-name\">GreenEcoCity \\u2014 App Prototype<\/div>\n        <div class=\"brand-tag\">Weigh it. Sell it. Get paid instantly. \\u2014 Coimbatore MVP<\/div>\n      <\/div>\n      <div class=\"row\" style=\"gap:10px;\">\n        <div class=\"identity\">\n          <span class=\"acct-av\" style=\"width:28px;height:28px;background:${roleMeta.av}22;color:${roleMeta.av};\">${(roleMeta.tag||'?')[0]}<\/span>\n          <span><span class=\"who\">${roleMeta.tag||''}<\/span><br><span class=\"role-tag\">${roleMeta.label}<\/span><\/span>\n        <\/div>\n        <button class=\"logout-btn\" onclick=\"logout()\">Switch / Logout<\/button>\n      <\/div>\n    <\/div>\n    ${body}\n    ${STATE.auth.role==='admin' ? '<div class=\"tip3d\">Every action here updates the linked customer Track screen and the rider app in real time \\u2014 try accepting the order marked \\u25cf app, then log in as that customer or rider.<\/div>' : ''}\n    ${STATE.auth.role==='rider' ? '<div class=\"tip3d\">Complete a pickup here and the customer sees \\u201cPayment credited\\u201d on their Track screen instantly.<\/div>' : ''}\n  <\/div>`;\n}\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};</script>
<script>

const TP=[["verdict","Verdict"],["invest","Investment"],["fish","Fish & pricing"],["profit","Profit model"],["mkt","Marketing"],["legal","Legal"],["plan","90-day plan"]];

const E='<span class="est">EST</span>',R='<span class="ok">REF</span>';

/* ---------- data ---------- */
const INV=[["Used 3-wheeler / small loader with insulated box body (or hire a pickup for Sundays first)",110000],["2 insulated ice boxes (100 L) + display trays",8000],["Digital scale, knives, chopping block, aprons, gloves",10000],["Ice, crates, packaging, water tubs (first month)",3000],["FSSAI, trade licence, Udyam, vehicle permit and fees",4000],["Mini-kitchen: stove, kadai, tawa, utensils, commercial cylinder",15000],["Banner, boards, phone, domain, WhatsApp Business setup",8000],["Initial fish stock (first Sunday)",15000],["Working capital (30 days of fuel, ice, wages)",20000],["Contingency",6000]];
const FISH=[["Mathi (sardine)",120,"Fast mover, low cost, best for evening fry"],["Ayila (mackerel)",250,"Home-cook staple"],["Nethili (anchovy)",250,"Fry / kuzhambu"],["Freshwater rohu / catla",170,"Steady demand, low wastage"],["Vilai",350,"Mid range"],["Paarai (trevally)",400,"Sunday premium"],["Prawns",500,"High margin, needs ice discipline"],["Crab",450,"Order-based only"],["Vanjiram (seer)",800,"Pre-order only, never stock blind"]];
const SC={cons:{n:"Conservative",kg:15,mk:18,w:10,k:0},real:{n:"Realistic",kg:28,mk:25,w:7,k:2500},opt:{n:"Optimistic",kg:45,mk:30,w:5,k:4500}};
let G={cost:300,days:26,fuel:350,ice:150,misc:3000,fixed:2000,kmargin:35,kdays:20};
const SCRAP=[["Newspaper / office paper",13],["Cardboard / cotton and carton boxes",9],["PET plastic bottles",18],["Hard plastic / containers",16],["Glass bottles (per kg)",3],["Tin / metal cans",25]];
let reqs=[];try{reqs=JSON.parse(localStorage.getItem("gec_reqs")||"[]")}catch(e){}
let owner="";let cartP={};
/* ---------- helpers ---------- */
function calc(s){const c=G.cost,gpk=(1-s.w/100)*(1+s.mk/100)*c-c,gross=s.kg*gpk*G.days,op=(G.fuel+G.ice)*G.days+G.misc+G.fixed,kit=s.k*(G.kmargin/100)*G.kdays,net=gross-op+kit;return{gpk,gross,op,kit,net,be:op/(G.days*gpk),rev:s.kg*(1-s.w/100)*c*(1+s.mk/100)*G.days}}
function sc(k,f,v){SC[k][f]=+v;goP("profit")}function gv(f,v){G[f]=+v;goP("profit")}
/* ---------- views ---------- */
const VP={
verdict(){const r=calc(SC.real),c=calc(SC.cons),tot=INV.reduce((a,b)=>a+b[1],0);return`
<div class="alert bad"><b>Do not buy a new refrigerated van with a ₹2 lakh budget.</b> A new Tata Ace alone is listed from about ₹3.99 lakh (Ace Pro / Ace Gold Petrol launch prices) up to ₹6+ lakh for diesel, before the refrigeration body. ${R} Even second-hand reefer vans were seen listed at ₹3.85 lakh and above. That is 2 to 3 times your budget, and the whole budget would go on the vehicle with nothing left for stock.</div>
<div class="alert good"><b>Viable if you start lean:</b> a used 3-wheeler or hired pickup with insulated ice boxes, Sunday-first selling, pre-orders on WhatsApp and the evening mini kitchen to convert unsold fish into higher-margin food. Buy the refrigerated van only after 3 profitable months, funded from profit or a vehicle loan.</div>
<div class="grid"><div class="kpi"><b>${inr(tot)}</b><span>Lean phase-1 budget (${E})</span></div>
<div class="kpi"><b>${inr(c.net)}</b><span>Conservative monthly net</span></div>
<div class="kpi"><b class="pos">${inr(r.net)}</b><span>Realistic monthly net</span></div>
<div class="kpi"><b>${r.be.toFixed(0)} kg/day</b><span>Break-even (realistic costs)</span></div></div>
<div class="card" style="margin-top:14px"><h2>Why this combination works</h2><ul>
<li><b>One vehicle, two businesses.</b> Tuesday to Saturday mornings: scrap pickups from offices and apartments. Sunday: fish. Evening: mini kitchen. The vehicle earns every day.</li>
<li><b>Same customers.</b> Apartment associations and offices that give you scrap become your first fish customers, so marketing cost is shared.</li>
<li><b>Wastage control.</b> Buy against pre-orders, sell the premium fish first, fry or curry whatever is left the same evening, and never freeze-and-resell as fresh.</li></ul></div>
<div class="card"><h2>Biggest risks</h2><ul><li>Fish is perishable: one bad buying day can wipe out a week of margin. Buy small, buy often.</li><li>Prices on this page are estimates. Check actual Ukkadam rates at 4 to 6 am for two weeks before spending money.</li><li>Fishing ban periods and monsoon push prices up and supply down.</li><li>Partnership: write down roles, capital split and profit share with your friend before you start.</li></ul></div>`},
invest(){const t=INV.reduce((a,b)=>a+b[1],0);return`<div class="card"><h2>Phase 1: lean start (budget ${inr(200000)})</h2><div class="ov"><table><tr><th>Item</th><th>Amount</th></tr>${INV.map(i=>`<tr><td>${i[0]} ${E}</td><td>${inr(i[1])}</td></tr>`).join("")}<tr><td><b>Total</b></td><td><b>${inr(t)}</b></td></tr></table></div></div>
<div class="card"><h2>Phase 2: refrigerated van (after month 3)</h2><div class="ov"><table><tr><th>Option</th><th>Price seen</th></tr><tr><td>New Tata Ace Pro / Gold Petrol (ex-showroom, no cooling) ${R}</td><td>from ₹3.99 lakh</td></tr><tr><td>New Tata Ace Gold+ Diesel ${R}</td><td>from ₹5.52 lakh</td></tr><tr><td>Used 2020 Bolero reefer van listing ${R}</td><td>₹3.85 lakh</td></tr><tr><td>Insulation / reefer body alone (listings vary widely) ${E}</td><td>₹1.5 to 3 lakh</td></tr></table></div><p class="sub">Get written quotations from at least 3 sellers (Tata dealers in Coimbatore, body builders on Avinashi Road, and used-vehicle dealers) before committing. Prices above are listings, not confirmed quotes.</p></div>`},
fish(){return`<div class="card"><h2>Fish varieties and pricing</h2><p class="sub">Wholesale figures are rough rates from local news and price sites, which disagree with each other and change daily. ${E} Retail = wholesale + 25% for door delivery (market retail is typically only about 10% above wholesale ${R}, so delivery convenience must justify the extra).</p>
<div class="ov"><table><tr><th>Fish</th><th>Wholesale/kg</th><th>Retail/kg</th><th>Note</th><th>Add</th></tr>${FISH.map((f,i)=>`<tr><td>${f[0]}</td><td>${inr(f[1])}</td><td>${inr(f[1]*1.25)}</td><td>${f[2]}</td><td><input type="number" min="0" step="0.5" style="width:60px" value="${cartP[i]||""}" onchange="cartP[${i}]=+this.value;tot()"></td></tr>`).join("")}</table></div>
<div class="f2" style="margin-top:12px"><div><label>Customer name</label><input id="cn"></div><div><label>Delivery area</label><input id="ca" placeholder="e.g. Singanallur"></div><div><label>Your WhatsApp number (10 digits)</label><input id="ow" value="${owner}" onchange="owner=this.value"></div></div>
<p id="ct" class="sub"></p><button class="btn" onclick="ord()">Send order on WhatsApp</button></div>
<div class="card"><h3>Sourcing plan</h3><ul><li><b>Ukkadam wholesale market:</b> go at 4 to 6 am, build one trusted agent, ask for daily rates in writing on WhatsApp.</li><li><b>Direct from fishermen:</b> Tamil Nadu coastal landing centres are far from Coimbatore, so use a bulk supplier or agent who ships by insulated transport. Test with one weekly consignment first.</li><li><b>Wastage targets:</b> 10% first month, under 6% by month 3. Track kg bought vs kg sold daily.</li></ul></div>`},
profit(){const keys=["cons","real","opt"],o=keys.map(k=>calc(SC[k]));
const row=(l,f,u)=>`<tr><td>${l}</td>${keys.map(k=>`<td><input type="number" value="${SC[k][f]}" onchange="sc('${k}','${f}',this.value)"></td>`).join("")}</tr>`;
const out=(l,fn,b)=>`<tr><td>${b?"<b>"+l+"</b>":l}</td>${o.map(x=>`<td>${b?"<b>":""}${fn(x)}${b?"</b>":""}</td>`).join("")}</tr>`;
return`<div class="card"><h2>Monthly profitability: three scenarios</h2><p class="sub">All inputs are editable and are ${E}. Change them as you learn real numbers.</p>
<div class="f2"><div><label>Avg wholesale cost ₹/kg</label><input type="number" value="${G.cost}" onchange="gv('cost',this.value)"></div><div><label>Working days / month</label><input type="number" value="${G.days}" onchange="gv('days',this.value)"></div><div><label>Fuel per day ₹</label><input type="number" value="${G.fuel}" onchange="gv('fuel',this.value)"></div><div><label>Ice per day ₹</label><input type="number" value="${G.ice}" onchange="gv('ice',this.value)"></div><div><label>Packaging, phone, misc ₹/month</label><input type="number" value="${G.misc}" onchange="gv('misc',this.value)"></div><div><label>Insurance, licences, repairs ₹/month</label><input type="number" value="${G.fixed}" onchange="gv('fixed',this.value)"></div><div><label>Kitchen margin % (before gas and labour)</label><input type="number" value="${G.kmargin}" onchange="gv('kmargin',this.value)"></div><div><label>Kitchen days / month</label><input type="number" value="${G.kdays}" onchange="gv('kdays',this.value)"></div></div>
<div class="ov" style="margin-top:12px"><table><tr><th></th>${keys.map(k=>`<th>${SC[k].n}</th>`).join("")}</tr>
${row("Fish bought and sold, kg/day","kg")}${row("Retail markup %","mk")}${row("Wastage %","w")}${row("Kitchen sales ₹/day","k")}
${out("Fish revenue / month",x=>inr(x.rev))}${out("Gross profit / month",x=>inr(x.gross))}${out("Operating cost / month",x=>inr(x.op))}${out("Kitchen profit / month",x=>inr(x.kit))}
${out("Net profit / month",x=>`<span class="${x.net>=0?"pos":"neg"}">${inr(x.net)}</span>`,1)}${out("Break-even kg/day",x=>x.be.toFixed(1))}${out("Payback on ₹2 lakh",x=>x.net>0?(200000/x.net).toFixed(1)+" months":"never")}</table></div>

done(){const l=S.orders.filter(o=>o.sf==A.name&&o.st=="Paid"),kg=l.reduce((a,o)=>a+Object.values(o.act).reduce((x,y)=>x+y,0),0);return`<div class="grid"><div class="kpi"><b>${l.length}</b><span>Pickups completed</span></div><div class="kpi"><b>${kg} kg</b><span>Collected</span></div><div class="kpi"><b>${inr(l.reduce((a,o)=>a+o.amt,0))}</b><span>Paid to customers</span></div></div>`+l.map(o=>ordCard(o)).join("")},
dash(){const f=fin(),od=S.orders,paid=od.filter(o=>o.st=="Paid").reduce((a,o)=>a+o.amt,0),kgBy={};od.filter(o=>o.act).forEach(o=>Object.entries(o.act).forEach(([k,v])=>kgBy[k]=(kgBy[k]||0)+v));const kg=Object.values(kgBy).reduce((a,b)=>a+b,0),fo=ITEMS.slice(0,NF).reduce((a,x)=>a+oh(x[0]),0),tb=Object.values(S.stock).reduce((a,s)=>a+s.b,0),tw=Object.values(S.stock).reduce((a,s)=>a+s.w,0),td=dk(),fk=S.bills.filter(b=>b.d&&b.k==td).length,sold=S.bills.reduce((a,b)=>a+(b.k==td?b.lines.filter(l=>l.f).reduce((x,l)=>x+l.q,0):0),0),cr=S.bills.filter(b=>!b.paid).reduce((a,b)=>a+b.tot,0),cap=f.p.A.cap+f.p.B.cap;

<div class="two"><div class="card"><h2>Profit, last 7 days</h2>${trend()}</div><div class="card"><h2>Pickup pipeline</h2>${hb(ST.concat("Cancelled").map(s=>[s,od.filter(o=>o.st==s).length]))}</div><div class="card"><h2>Scrap collected by item (kg)</h2>${Object.keys(kgBy).length?hb(Object.entries(kgBy)):'<span class="dim">No weighed pickups yet.</span>'}</div>

ord(){const chips=["All",...ST,"Cancelled"].map(s=>`<button class="pill ${F==s?"s-Paid":""}" onclick="F='${s}';go()">${s}</button>`).join(" "),l=S.orders.filter(o=>(F=="All"||o.st==F)&&(o.c+o.ar+o.id).toLowerCase().includes(Q.toLowerCase())).reverse();return`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${chips}</div><input placeholder="Search name, area or order number" value="${esc(Q)}" onchange="Q=this.value;go()"></div>`+(l.length?l.map(o=>{let b="";if(o.st=="Requested")b=`<button class="btn sm" onclick="adm(${o.id},'Accepted')">Accept</button> <button class="btn sm r" onclick="adm(${o.id},'Cancelled')">Reject</button>`;if(o.st=="Accepted")b=STAFF.map(s=>`<button class="btn sm o" onclick="asg(${o.id},'${s}')">Assign ${s}</button>`).join(" ");return ordCard(o,b+` <button class="btn sm o" onclick="wa(${o.id})">WhatsApp customer</button>`)}).join(""):'<div class="card dim">No matching orders.</div>')},
stock(){const T=ITEMS.slice(0,NF);return`<div class="card"><h2>Fish stock and wastage</h2><p class="sub">Enter kg, then choose Bought (from Ukkadam or fishermen), Kitchen (leftover used for evening dishes, no loss) or Waste (written off at cost). Bills deduct stock automatically.</p><div class="ov"><table><tr><th>Fish</th><th>On hand</th><th>Bought</th><th>Sold</th><th>Kitchen</th><th>Waste</th><th>Kg</th><th></th></tr>${T.map((f,i)=>{const s=S.stock[f[0]]||{b:0,s:0,k:0,w:0};return`<tr><td>${f[0]}</td><td><b>${oh(f[0]).toFixed(1)}</b></td><td>${s.b}</td><td>${s.s}</td><td>${s.k}</td><td>${s.w}</td><td><input id="sq${i}" type="number" min="0" step="0.25"></td><td><button class="btn sm" onclick="stk(${i},'b')">Bought</button> <button class="btn sm o" onclick="stk(${i},'k')">Kitchen</button> <button class="btn sm r" onclick="stk(${i},'w')">Waste</button></td></tr>`}).join("")}</table></div></div>`},
bill(){const sub=ITEMS.reduce((a,f,i)=>a+(+cart[i]||0)*f[2],0);return`<div class="card"><h2>Billing: fish and mini kitchen</h2><div class="ov"><table><tr><th>Item</th><th>Cost</th><th>Price</th><th>Unit</th><th>In stock</th><th>Qty</th></tr>${ITEMS.map((f,i)=>`<tr><td>${f[0]}</td><td class="dim">${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${i<NF?oh(f[0]).toFixed(1):"-"}</td><td><input type="number" min="0" step="0.25" value="${cart[i]||""}" onchange="cart[${i}]=this.value;go()"></td></tr>`).join("")}</table></div><div class="f" style="margin-top:10px"><div><label>Customer</label><input id="bc"></div><div><label>Discount %</label><input id="bd" type="number" value="0"></div><div><label>Payment</label><select id="bm"><option>UPI</option><option>Cash</option><option>Credit</option></select></div></div><p>Subtotal: <b>${inr(sub)}</b> <button class="btn" onclick="mkBill()">Generate bill</button></p><p class="dim">Prices and costs are estimates (wholesale + 25% for fish). Credit bills stay outstanding until marked paid.</p></div>${last?`<div class="card"><div class="bill"><b>GREENECOCITY FRESH FISH</b><br>Bill #${last.no} · ${last.d}<br>Customer: ${esc(last.c)}<hr>${last.lines.map(l=>`${l.n} ${l.q} ${l.u} x ${l.p} = ${inr(l.q*l.p)}`).join("<br>")}<hr>Subtotal ${inr(last.sub)}<br>Discount ${last.disc}%<br><b>TOTAL ${inr(last.tot)}</b> (${last.mode})</div><p class="noprint"><button class="btn o" onclick="window.print()">Print bill</button></p></div>`:""}<div class="card"><h2>Bill history</h2>${S.bills.length?S.bills.slice().reverse().map(b=>`<div>#${b.no} · ${esc(b.c)} · ${inr(b.tot)} · ${b.mode} · ${b.d} ${b.paid?"":`<button class="btn sm" onclick="S.bills.find(x=>x.no==${b.no}).paid=true;save();go()">Mark paid</button>`}</div>`).join(""):'<span class="dim">No bills yet.</span>'}</div>`},
rates(){return`<div class="card"><h2>Rates: edit and customers see them instantly</h2><div class="ov"><table><tr><th>Item</th><th>Ours (pay customer)</th><th>Local kabadi</th><th>Scrap app</th><th>Dealer (we sell)</th><th>Margin/kg</th></tr>${Object.keys(S.rates).map(k=>{const r=S.rates[k];return`<tr><td>${k}</td>${["o","l","a","d"].map(f=>`<td><input type="number" step="0.5" value="${r[f]}" onchange="S.rates['${k}'].${f}=+this.value;save();go()"></td>`).join("")}<td class="${r.d-r.o>=0?"pos":"neg"}">${(r.d-r.o).toFixed(1)}</td></tr>`}).join("")}</table></div><p class="dim">All competitor and dealer rates are estimates. Check with local dealers weekly.</p></div>`},
pn(){const f=fin(),mine1=A.role=="partner"?[A.name]:["A","B"];return`<div class="grid"><div class="kpi"><b>${inr(f.pr)}</b><span>Gross profit booked</span></div><div class="kpi"><b>${inr(f.ex)}</b><span>Expenses and wastage</span></div><div class="kpi"><b class="${f.net>=0?"pos":"neg"}">${inr(f.net)}</b><span>Net profit to split</span></div></div><div class="grid">${["A","B"].map(k=>{const p=f.p[k],me=A.role=="partner"&&A.name==k;return`<div class="card" style="${me?"border-color:var(--g)":""}"><h2>${PN[k]}${me?" (you)":""} · ${p.pct}%</h2><table><tr><td>Capital put in</td><td>${inr(p.cap)}</td></tr><tr><td>Profit share</td><td>${inr(p.sr)}</td></tr><tr><td>Withdrawn</td><td>${inr(p.wd)}</td></tr><tr><td><b>Balance owed to partner</b></td><td><b class="pos">${inr(p.bal)}</b></td></tr></table></div>`}).join("")}</div>
<div class="card"><h2>Profit split and new transaction</h2><div class="f"><div><label>Partner A share %</label><input type="number" min="0" max="100" value="${S.sa}" ${A.role=="admin"?"":"disabled"} onchange="S.sa=Math.min(100,Math.max(0,+this.value));save();go()"></div><div><label>Partner</label><select id="tw">${mine1.map(k=>`<option value="${k}">${PN[k]}</option>`).join("")}</select></div><div><label>Type</label><select id="tt"><option value="capital">Capital in</option><option value="withdraw">Withdrawal</option><option value="expense">Business expense</option></select></div><div><label>Amount ₹</label><input id="ta" type="number"></div><div><label>Note</label><input id="tn"></div></div><p><button class="btn" onclick="addTx()">Record transaction</button></p></div>

function submitReq(){const it={};Object.keys(S.rates).forEach(k=>{const v=+g("r_"+k);if(v>0)it[k]=v});if(!g("ra")||!Object.keys(it).length)return alert("Enter area and at least one item.");mk(A.name,g("rp"),g("ra"),it);save();tab="my";go()}
function adm(id,s){step(get(id),s);save();go()}function asg(id,s){assign(get(id),s);save();go()}
function wa(id){const o=get(id);window.open("https://wa.me/91"+o.ph+"?text="+encodeURIComponent("Hello "+o.c+", your GreenEcoCity pickup #"+o.id+" is "+o.st+"."),"_blank")}
